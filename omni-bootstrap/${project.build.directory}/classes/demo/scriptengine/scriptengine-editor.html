<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>源码编辑</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { height:100%; background:transparent; }
        .editor-wrapper { height:100%; padding:12px 16px 16px 16px; display:flex; flex-direction:column; }
        .editor-toolbar { display:flex; gap:8px; align-items:center; padding-bottom:8px; flex-shrink:0; flex-wrap:wrap; }
        .btn-sm { padding:4px 14px; font-size:12px; border-radius:20px; border:1px solid rgba(0,102,255,0.3); background:rgba(0,102,255,0.08); cursor:pointer; transition:0.2s; color:#0066ff; }
        .btn-sm:hover { background:rgba(0,102,255,0.2); }
        .char-count { margin-left:auto; font-size:12px; color:#94a3b8; }
        #scriptEditor { flex:1; width:100%; padding:14px 16px; border:1px solid rgba(0,102,255,0.3); border-radius:16px; background:#0a0f1a; color:#e2e8f0; font-family:'JetBrains Mono',monospace; font-size:14px; line-height:1.7; resize:none; transition:border-color 0.2s; min-height:120px; }
        #scriptEditor:focus { outline:none; border-color:#0066ff; box-shadow:0 0 0 3px rgba(0,102,255,0.2); }
        .status-bar { padding:6px 4px 0 4px; font-size:12px; color:#94a3b8; display:flex; justify-content:flex-start; flex-shrink:0; }
        ::-webkit-scrollbar { width:4px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:#0066ff; border-radius:4px; }
    </style>
</head>
<body>
<div class="editor-wrapper">
    <div class="editor-toolbar">
        <button id="editorExampleBtn" class="btn-sm">📋 插入示例</button>
        <button id="editorClearBtn" class="btn-sm">🗑️ 清空</button>
        <span id="charCount" class="char-count">0 字符</span>
    </div>
    <textarea id="scriptEditor" spellcheck="false" placeholder="等待加载示例..."></textarea>
    <div class="status-bar">
        <span id="cursorInfo">行 1, 列 1</span>
    </div>
</div>
<script src="scriptengine-editor.js"></script>
</body>
</html>
