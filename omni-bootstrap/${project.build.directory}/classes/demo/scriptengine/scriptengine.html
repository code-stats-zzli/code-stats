<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>脚本引擎 · CodeStats</title>
    <style>
        /* 样式不变，略... */
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { height:100%; overflow:hidden; background:#f0f4fa; font-family:'Inter','Segoe UI',sans-serif; color:#1e293b; }
        .engine-layout { display:flex; height:100vh; width:100%; background:transparent; }
        .sidebar-panel { width:45%; min-width:400px; background:rgba(255,255,255,0.7); backdrop-filter:blur(16px); border-right:1px solid rgba(0,102,255,0.25); display:flex; flex-direction:column; border-radius:0 24px 24px 0; overflow:hidden; }
        .sidebar-tabs { display:flex; border-bottom:1px solid rgba(0,102,255,0.2); flex-shrink:0; padding:0 16px; }
        .sidebar-tabs .tab-btn { flex:1; padding:12px 8px; background:transparent; border:none; border-bottom:2px solid transparent; font-size:14px; font-weight:500; color:#5b6e8c; cursor:pointer; transition:0.2s; text-align:center; }
        .sidebar-tabs .tab-btn:hover { color:#0066ff; background:rgba(0,102,255,0.05); }
        .sidebar-tabs .tab-btn.active { color:#0066ff; border-bottom-color:#0066ff; background:rgba(0,102,255,0.08); }
        .iframe-container { flex:1; position:relative; overflow:hidden; background:rgba(255,255,255,0.3); }
        .iframe-container iframe { width:100%; height:100%; border:none; display:block; background:transparent; }
        .sidebar-footer { padding:12px 20px 16px; border-top:1px solid rgba(0,102,255,0.2); flex-shrink:0; background:rgba(255,255,255,0.5); }
        .btn-block { width:100%; padding:12px; font-size:16px; border-radius:40px; border:none; background:#0066ff; color:white; font-weight:600; cursor:pointer; transition:0.2s; }
        .btn-block:hover { background:#0050cc; transform:translateY(-1px); box-shadow:0 4px 12px rgba(0,102,255,0.3); }
        .result-panel { flex:1; display:flex; flex-direction:column; background:rgba(255,255,255,0.7); backdrop-filter:blur(16px); margin:0 20px 20px 20px; border-radius:24px; border:1px solid rgba(0,102,255,0.25); overflow:hidden; min-width:0; }
        .result-header { display:flex; justify-content:space-between; align-items:center; padding:16px 24px; border-bottom:1px solid rgba(0,102,255,0.2); flex-shrink:0; background:rgba(255,255,255,0.3); }
        .result-header span { font-weight:600; color:#0066ff; }
        .btn-sm { padding:4px 14px; font-size:12px; border-radius:20px; border:1px solid rgba(0,102,255,0.3); background:rgba(0,102,255,0.08); cursor:pointer; transition:0.2s; color:#0066ff; }
        .btn-sm:hover { background:rgba(0,102,255,0.2); }
        .result-content { flex:1; overflow-y:auto; padding:20px 24px; font-family:'JetBrains Mono',monospace; font-size:13px; white-space:pre-wrap; word-break:break-all; background:rgba(0,0,0,0.02); }
        .empty-tip { color:#5b6e8c; text-align:center; padding:40px 0; }
        .success-output { color:#22c55e; }
        .error-output { color:#ef4444; }
        .loading { color:#0066ff; animation:pulse 1s infinite; }
        @keyframes pulse { 0%{opacity:0.6} 50%{opacity:1} 100%{opacity:0.6} }
        ::-webkit-scrollbar { width:6px; height:6px; }
        ::-webkit-scrollbar-track { background:#e2e8f0; border-radius:8px; }
        ::-webkit-scrollbar-thumb { background:#0066ff; border-radius:8px; }
        @media (max-width:768px) { .engine-layout { flex-direction:column; } .sidebar-panel { width:100%; min-width:unset; height:55vh; border-right:none; border-bottom:1px solid rgba(0,102,255,0.25); border-radius:0 0 24px 24px; } .result-panel { margin:0; border-radius:0; height:45vh; } }
    </style>
    <script>
        window.apiUrl = function(path) {
            var ctx = '';
            var pathname = window.location.pathname;
            var parts = pathname.split('/');
            if (parts.length > 1 && parts[1]) ctx = '/' + parts[1];
            if (path.startsWith('/')) return ctx + path;
            return ctx + '/' + path;
        };
    </script>
</head>
<body>
<div class="engine-layout">
    <aside class="sidebar-panel">
        <div class="sidebar-tabs">
            <button class="tab-btn active" data-tab="config">⚙️ 参数配置</button>
            <button class="tab-btn" data-tab="editor">📝 源码编辑</button>
        </div>
        <div class="iframe-container" id="iframeContainer">
            <iframe id="contentFrame" src="scriptengine-config.html"></iframe>
        </div>
        <div class="sidebar-footer">
            <button id="executeBtn" class="btn-block">🚀 执行脚本</button>
        </div>
    </aside>
    <main class="result-panel">
        <div class="result-header">
            <span>📄 执行结果</span>
            <button id="copyResultBtn" class="btn-sm">📋 复制</button>
        </div>
        <div id="resultArea" class="result-content">
            <div class="empty-tip">点击「执行脚本」或上传文件后自动执行</div>
        </div>
    </main>
</div>
<script src="scriptengine.js"></script>
</body>
</html>
