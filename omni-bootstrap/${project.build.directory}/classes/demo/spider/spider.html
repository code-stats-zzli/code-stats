<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网页爬虫 - CSDN 博客下载</title>
    <link rel="stylesheet" href="../global-tech.css">
    <link rel="stylesheet" href="spider.css">
    <script src="../global.js"></script>
</head>
<body>
<div class="spider-container">
    <div class="spider-header">
        <h1>🌐 CSDN 博客爬虫</h1>
        <p>输入 CSDN 用户名，一键下载所有博客文章（支持合并打包，失败链接自动追加）</p>
    </div>

    <div class="spider-config-panel">
        <div class="config-row">
            <label>CSDN 用户名：</label>
            <input type="text" id="username" placeholder="例如: qq_41652036" value="qq_41652036">
        </div>
        <div class="config-row">
            <label>并发数：</label>
            <input type="number" id="maxConcurrent" value="3" min="1" max="10">
            <span class="hint">同时下载文章数，建议 2~3</span>
        </div>
        <div class="config-row">
            <label>请求间隔(ms)：</label>
            <input type="number" id="intervalMs" value="1500" min="500">
            <span class="hint">避免触发反爬，建议 ≥1000</span>
        </div>
        <div class="config-row">
            <label>最多文章数：</label>
            <input type="number" id="maxArticles" value="100" min="1" max="10000">
            <span class="hint">达到该数量后自动停止</span>
        </div>
        <div class="config-row">
            <label>最大时间(秒)：</label>
            <input type="number" id="maxTimeSeconds" value="0" min="0">
            <span class="hint">0 表示不限制，超过该时间自动停止</span>
        </div>
        <div class="config-row">
            <label>合并文件：</label>
            <input type="checkbox" id="mergeEnabled" checked>
            <span>将所有文章合并为一个 TXT 文件（失败链接也会追加）</span>
        </div>
        <div class="config-row" id="mergeFileNameRow">
            <label>合并文件名：</label>
            <input type="text" id="mergeFileName" value="merged.txt" placeholder="merged.txt">
        </div>
        <div class="action-bar">
            <button id="startBtn" class="btn-primary">🚀 开始爬取</button>
            <button id="resetBtn" class="btn-secondary">重置</button>
        </div>
    </div>

    <div class="progress-area" id="progressArea" style="display: none;">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div id="progressText" class="progress-text">准备中...</div>
    </div>

    <div class="live-status" style="margin: 16px 0; background: rgba(0,102,255,0.1); border-radius: 16px; padding: 12px;">
        <div><strong>⚡ 当前步骤：</strong> <span id="currentStep">-</span></div>
        <div><strong>🔗 正在处理：</strong> <span id="currentUrl">-</span></div>
    </div>
    <div class="summary-info" id="summaryInfo" style="margin: 16px 0; background: var(--bg-card); border-radius: 20px; padding: 12px; display: flex; gap: 24px;"></div>

    <div id="resultArea" class="result-area" style="display: none;">
        <!-- 作者栏（包含简要信息和查看详情按钮） -->
        <div id="authorInfo" class="author-card" style="display: flex; justify-content: space-between; align-items: center;">
            <div class="author-details"></div>
            <div style="display: flex; gap: 12px; align-items: center;">
                <button id="showAuthorDetailBtn" class="btn-secondary" style="display: none;">📋 查看作者详细信息</button>
                <div id="mergeDownloadWrapper">
                    <button id="downloadMergeBtn" class="btn-primary" style="display: none;">📥 下载合并文件（含失败链接）</button>
                </div>
            </div>
        </div>

        <!-- 文章列表选项卡 -->
        <div class="result-tabs" style="display: flex; gap: 8px; margin: 20px 0 12px 0;">
            <button id="tabSuccessBtn" class="tab-btn active">✅ 成功文章 (<span id="successCount">0</span>)</button>
            <button id="tabFailedBtn" class="tab-btn">❌ 失败文章 (<span id="failedCount">0</span>)</button>
        </div>

        <div id="successPanel" class="tab-pane active">
            <div id="articleTableWrapper" class="article-wrapper"></div>
        </div>
        <div id="failedPanel" class="tab-pane" style="display: none;">
            <div id="failedArticleWrapper" class="article-wrapper">
                <table class="data-table">
                    <thead><tr><th>URL</th><th>失败原因</th></tr></thead>
                    <tbody id="failedTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- 作者详情弹窗 -->
<div id="authorDetailModal" class="modal" style="display: none;">
    <div class="modal-content" style="width: 600px; max-width: 90%;">
        <div class="modal-header">
            <span>📖 作者详细信息</span>
            <span class="close-modal" id="closeAuthorModalBtn">&times;</span>
        </div>
        <div class="modal-body" id="authorDetailBody">
            <div class="loading">加载中...</div>
        </div>
        <div class="modal-footer">
            <button id="closeModalFooterBtn" class="btn-secondary">关闭</button>
        </div>
    </div>
</div>

<script src="spider.js"></script>
</body>
</html>
