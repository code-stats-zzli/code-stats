<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>配置化 3D 场景 - CodeStats</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; background: #0a0f1a; font-family: 'Inter', sans-serif; color: #e2e8f0; }
        #app { display: flex; flex-direction: column; height: 100vh; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 24px;
            background: rgba(20,30,50,0.85);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(0,102,255,0.3);
            flex-shrink: 0; z-index: 10;
        }
        .header h1 { font-size: 18px; color: #4da6ff; }
        .controls { display: flex; gap: 12px; align-items: center; }
        .btn {
            background: rgba(0,102,255,0.2);
            border: 1px solid rgba(0,102,255,0.4);
            color: #e2e8f0;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .btn:hover { background: rgba(0,102,255,0.4); }
        .btn.active { background: #0066ff; color: white; }
        #canvas-container { flex: 1; position: relative; overflow: hidden; }
        #loading-overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10,15,26,0.9);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 20; transition: opacity 0.5s;
        }
        #loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 48px; height: 48px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #4da6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hint {
            position: absolute; bottom: 20px; right: 20px;
            color: rgba(255,255,255,0.3); font-size: 12px;
            background: rgba(0,0,0,0.4);
            padding: 6px 14px; border-radius: 20px;
            pointer-events: none;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
<div id="app">
    <header class="header">
        <h1>⚙️ 配置化 3D 场景引擎</h1>
        <div class="controls">
            <button id="reloadBtn" class="btn">🔄 重载配置</button>
            <span id="status" style="font-size:13px;color:#94a3b8;">就绪</span>
        </div>
    </header>
    <div id="canvas-container">
        <div id="loading-overlay">
            <div class="spinner"></div>
            <div id="loading-text">正在加载场景配置...</div>
        </div>
        <div class="hint">🖱 拖拽旋转 · 滚轮缩放 · 点击球体查看详情</div>
    </div>
</div>

<script type="module">
    import { SceneEngine } from '../engine/SceneEngine.js';

    const container = document.getElementById('canvas-container');
    const overlay = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loading-text');
    const statusSpan = document.getElementById('status');
    const reloadBtn = document.getElementById('reloadBtn');

    let engine = null;

    async function boot() {
        statusSpan.textContent = '⏳ 加载中...';
        overlay.classList.remove('hidden');
        loadingText.textContent = '正在加载场景配置...';

        try {
            if (engine) engine.destroy();
            engine = new SceneEngine(container);
            await engine.load('../config/demo-scene.json');
            overlay.classList.add('hidden');
            statusSpan.textContent = '✅ 已加载';
            // 暴露到全局，方便调试
            window.__scene__ = engine;
        } catch (err) {
            console.error(err);
            loadingText.textContent = '❌ 加载失败: ' + err.message;
            statusSpan.textContent = '❌ 失败';
        }
    }

    reloadBtn.addEventListener('click', boot);
    boot();
</script>
</body>
</html>
