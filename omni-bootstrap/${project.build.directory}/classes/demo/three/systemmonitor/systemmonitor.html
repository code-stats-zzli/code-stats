<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>系统实时监控 · CodeStats</title>
    <style>
        /* ===================== 深色主题 ===================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            overflow: hidden;
            background: #0a0f1a;
            color: #e2e8f0;
            font-family: 'Inter', 'Segoe UI', 'PingFang SC', sans-serif;
        }
        #app { display: flex; flex-direction: column; height: 100vh; }

        /* ============ 头部 ============ */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 24px;
            background: rgba(20, 30, 50, 0.85);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(0, 102, 255, 0.3);
            flex-shrink: 0; z-index: 10;
        }
        .header h1 { font-size: 18px; font-weight: 600; color: #4da6ff; }
        .controls { display: flex; align-items: center; gap: 12px; font-size: 13px; }
        .controls .btn {
            background: rgba(0, 102, 255, 0.2);
            border: 1px solid rgba(0, 102, 255, 0.4);
            color: #e2e8f0;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .controls .btn:hover { background: rgba(0, 102, 255, 0.4); }
        .controls .btn.paused { background: #f59e0b; color: #0a0f1a; border-color: #f59e0b; }
        .controls select {
            background: rgba(0, 102, 255, 0.15);
            border: 1px solid rgba(0, 102, 255, 0.4);
            color: #e2e8f0;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }
        .controls select option { background: #0a0f1a; }
        .update-time { color: #94a3b8; font-size: 12px; font-family: monospace; }

        /* ============ 主体 ============ */
        .main { display: flex; flex: 1; min-height: 0; overflow: hidden; }

        /* 左侧分类 */
        .category-sidebar {
            width: 180px;
            background: rgba(20, 30, 50, 0.7);
            backdrop-filter: blur(8px);
            border-right: 1px solid rgba(0, 102, 255, 0.3);
            display: flex; flex-direction: column;
            flex-shrink: 0;
            padding: 16px 0;
            overflow-y: auto;
        }
        .cat-item {
            padding: 12px 20px;
            margin: 2px 8px;
            border-radius: 12px;
            cursor: pointer;
            color: #94a3b8;
            font-size: 14px;
            display: flex; align-items: center; gap: 10px;
            transition: 0.2s;
        }
        .cat-item:hover { background: rgba(0, 102, 255, 0.15); color: #e2e8f0; }
        .cat-item.active {
            background: rgba(0, 102, 255, 0.25);
            color: #4da6ff;
            box-shadow: inset 3px 0 0 #4da6ff;
        }
        .cat-item .count {
            margin-left: auto;
            font-size: 11px;
            background: rgba(0, 102, 255, 0.3);
            padding: 1px 8px;
            border-radius: 10px;
            color: #e2e8f0;
        }

        /* 右侧卡片网格 */
        .card-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            align-content: start;
        }

        /* 卡片 */
        .card {
            background: rgba(20, 30, 50, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 102, 255, 0.25);
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex; flex-direction: column; gap: 10px;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 4px; height: 100%;
            background: #4da6ff;
            opacity: 0.6;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color: #4da6ff;
            box-shadow: 0 8px 24px rgba(0, 102, 255, 0.25);
        }
        .card.status-WARN::before { background: #f59e0b; }
        .card.status-WARN { border-color: rgba(245, 158, 11, 0.5); }
        .card.status-ERROR::before { background: #ef4444; }
        .card.status-ERROR { border-color: rgba(239, 68, 68, 0.5); }

        .card-head { display: flex; align-items: center; gap: 10px; }
        .card-icon { font-size: 24px; }
        .card-name { font-weight: 600; color: #e2e8f0; font-size: 15px; }

        .card-primary {
            font-size: 26px;
            font-weight: 700;
            color: #4da6ff;
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.2;
        }
        .card-sub {
            font-size: 12px;
            color: #94a3b8;
            font-family: 'JetBrains Mono', monospace;
        }
        .card-desc {
            font-size: 11px;
            color: #94a3b8;
            line-height: 1.4;
            min-height: 28px;
        }
        .card-tag {
            font-size: 10px;
            background: rgba(0, 102, 255, 0.15);
            color: #4da6ff;
            padding: 2px 8px;
            border-radius: 10px;
            align-self: flex-start;
        }
        .card-bar {
            width: 100%;
            height: 4px;
            background: #1e293b;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 2px;
        }
        .card-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #4da6ff, #7c3aed);
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        .card-bar-fill.warn { background: linear-gradient(90deg, #f59e0b, #ef4444); }

        /* ============ 详情浮层 ============ */
        .detail-overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            z-index: 100;
        }
        .detail-panel {
            width: 760px; max-width: 92%;
            max-height: 85vh;
            background: rgba(20, 30, 50, 0.98);
            border: 1px solid rgba(0, 102, 255, 0.5);
            border-radius: 20px;
            display: flex; flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }
        .detail-header {
            padding: 18px 24px;
            border-bottom: 1px solid rgba(0, 102, 255, 0.3);
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0;
        }
        .detail-header h2 {
            color: #4da6ff; font-size: 18px;
            display: flex; align-items: center; gap: 10px;
        }
        .detail-header .status-badge {
            font-size: 11px; padding: 3px 10px;
            border-radius: 12px; font-weight: 600;
        }
        .status-badge.OK    { background: #22c55e; color: #0a0f1a; }
        .status-badge.WARN  { background: #f59e0b; color: #0a0f1a; }
        .status-badge.ERROR { background: #ef4444; color: white; }
        .detail-close {
            background: none; border: none;
            color: #94a3b8; font-size: 22px;
            cursor: pointer; padding: 4px 10px;
        }
        .detail-close:hover { color: #ef4444; }

        .detail-body {
            padding: 20px 24px;
            overflow-y: auto;
            flex: 1;
        }
        .section-title {
            color: #4da6ff;
            font-size: 14px;
            font-weight: 600;
            margin: 16px 0 10px 0;
            display: flex; align-items: center; gap: 8px;
        }
        .section-title:first-child { margin-top: 0; }
        .section-title::before {
            content: '';
            width: 3px; height: 14px;
            background: #4da6ff;
            border-radius: 2px;
        }

        /* 键值表 */
        .kv-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 10px;
            overflow: hidden;
        }
        .kv-table tr { border-bottom: 1px solid rgba(0, 102, 255, 0.1); }
        .kv-table tr:last-child { border-bottom: none; }
        .kv-table td { padding: 8px 14px; vertical-align: top; }
        .kv-table td:first-child {
            width: 180px;
            color: #94a3b8;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }
        .kv-table td:last-child {
            color: #e2e8f0;
            word-break: break-all;
        }

        /* 大进度条（详情内） */
        .big-bar {
            margin: 10px 0 18px 0;
            padding: 14px 18px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 14px;
            border: 1px solid rgba(0, 102, 255, 0.2);
        }
        .big-bar-label {
            display: flex; justify-content: space-between;
            font-size: 13px; color: #94a3b8;
            margin-bottom: 8px;
            font-family: 'JetBrains Mono', monospace;
        }
        .big-bar-label .val { color: #4da6ff; font-weight: 700; font-size: 16px; }
        .big-bar-track {
            width: 100%; height: 10px;
            background: #1e293b;
            border-radius: 6px;
            overflow: hidden;
        }
        .big-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #4da6ff, #7c3aed);
            border-radius: 6px;
            transition: width 0.4s ease;
        }
        .big-bar-fill.warn { background: linear-gradient(90deg, #f59e0b, #ef4444); }

        /* 分区卡片（磁盘） */
        .part-list { display: flex; flex-direction: column; gap: 10px; }
        .part-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid rgba(0, 102, 255, 0.15);
        }
        .part-head {
            display: flex; justify-content: space-between;
            font-size: 13px; margin-bottom: 8px;
            font-family: 'JetBrains Mono', monospace;
        }
        .part-head .name { color: #4da6ff; font-weight: 600; }
        .part-head .info { color: #94a3b8; font-size: 11px; }

        /* 进程表 */
        .proc-table {
            width: 100%; border-collapse: collapse;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 10px;
            overflow: hidden;
        }
        .proc-table th {
            background: rgba(0, 102, 255, 0.2);
            color: #4da6ff;
            padding: 8px 10px;
            text-align: left;
            font-size: 11px;
            position: sticky; top: 0;
        }
        .proc-table td {
            padding: 6px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-family: 'JetBrains Mono', monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .proc-table tr:hover td { background: rgba(0, 102, 255, 0.08); }
        .proc-table .pid { color: #f59e0b; }
        .proc-table .cmd { color: #e2e8f0; max-width: 260px; }
        .proc-table .cpu { color: #22c55e; text-align: right; }
        .proc-table .cur { color: #ef4444; font-weight: 600; }

        /* 线程状态分布 */
        .state-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }
        .state-cell {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 12px 14px;
            border-left: 3px solid #4da6ff;
        }
        .state-cell .lbl { font-size: 11px; color: #94a3b8; font-family: monospace; }
        .state-cell .num { font-size: 22px; color: #4da6ff; font-weight: 700; font-family: monospace; }
        .state-cell.waiting { border-left-color: #f59e0b; }
        .state-cell.waiting .num { color: #f59e0b; }
        .state-cell.runnable { border-left-color: #22c55e; }
        .state-cell.runnable .num { color: #22c55e; }
        .state-cell.timed { border-left-color: #fbbf24; }
        .state-cell.timed .num { color: #fbbf24; }
        .state-cell.blocked { border-left-color: #ef4444; }
        .state-cell.blocked .num { color: #ef4444; }

        /* 设备列表 */
        .device-list {
            list-style: none;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 10px;
            padding: 6px 0;
        }
        .device-list li {
            padding: 8px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 13px;
            display: flex; align-items: center; gap: 8px;
        }
        .device-list li:last-child { border-bottom: none; }
        .device-list li::before {
            content: '•'; color: #4da6ff; font-weight: bold;
        }

        /* 加载 / 空状态 */
        .loading, .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
            font-size: 14px;
        }
        .error {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #ef4444;
            font-size: 14px;
        }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4da6ff; border-radius: 4px; }

        @media (max-width: 640px) {
            .category-sidebar { width: 110px; }
            .card-area { grid-template-columns: 1fr; }
            .detail-panel { max-height: 90vh; }
        }
    </style>
</head>
<body>
<div id="app">
    <header class="header">
        <h1>🖥️ 系统实时运行监控</h1>
        <div class="controls">
            <span class="update-time" id="updateTime">等待采集...</span>
            <select id="intervalSel">
                <option value="1000">1 秒</option>
                <option value="2000" selected>2 秒</option>
                <option value="5000">5 秒</option>
                <option value="10000">10 秒</option>
            </select>
            <button id="pauseBtn" class="btn">⏸ 暂停</button>
            <button id="refreshBtn" class="btn">🔄 立即刷新</button>
        </div>
    </header>

    <div class="main">
        <aside class="category-sidebar" id="categorySidebar">
            <div class="cat-item active" data-category="ALL">
                <span>📦</span><span>全部</span>
                <span class="count" id="cnt-ALL">0</span>
            </div>
            <div class="cat-item" data-category="HARDWARE">
                <span>🔧</span><span>硬件</span>
                <span class="count" id="cnt-HARDWARE">0</span>
            </div>
            <div class="cat-item" data-category="OS">
                <span>🪟</span><span>操作系统</span>
                <span class="count" id="cnt-OS">0</span>
            </div>
            <div class="cat-item" data-category="JAVA">
                <span>☕</span><span>Java</span>
                <span class="count" id="cnt-JAVA">0</span>
            </div>
            <div class="cat-item" data-category="RUNTIME">
                <span>⚙️</span><span>运行时</span>
                <span class="count" id="cnt-RUNTIME">0</span>
            </div>
        </aside>

        <main class="card-area" id="cardArea">
            <div class="loading">⏳ 正在加载系统组件...</div>
        </main>
    </div>
</div>

<div class="detail-overlay" id="detailOverlay" style="display:none;">
    <div class="detail-panel">
        <div class="detail-header">
            <h2 id="detailTitle">组件详情</h2>
            <div style="display:flex; align-items:center; gap:12px;">
                <span class="status-badge OK" id="detailStatus">OK</span>
                <button class="detail-close" id="detailCloseBtn">✖</button>
            </div>
        </div>
        <div class="detail-body" id="detailBody"></div>
    </div>
</div>

<script>
    (function () {
        // ==================== Context Path ====================
        function getContextPath() {
            const parts = window.location.pathname.split('/');
            return (parts.length > 1 && parts[1]) ? '/' + parts[1] : '';
        }
        const CONTEXT_PATH = getContextPath();
        function apiUrl(path) {
            return CONTEXT_PATH + (path.startsWith('/') ? path : '/' + path);
        }
        const API_BASE = apiUrl('/systemmonitor/api');

        // ==================== 状态 ====================
        let allItems = [];
        let currentCategory = 'ALL';
        let paused = false;
        let timer = null;

        // ==================== DOM ====================
        const cardArea    = document.getElementById('cardArea');
        const updateTime  = document.getElementById('updateTime');
        const pauseBtn    = document.getElementById('pauseBtn');
        const refreshBtn  = document.getElementById('refreshBtn');
        const intervalSel = document.getElementById('intervalSel');
        const overlay     = document.getElementById('detailOverlay');
        const detailTitle = document.getElementById('detailTitle');
        const detailBody  = document.getElementById('detailBody');
        const detailStatus= document.getElementById('detailStatus');
        const detailClose = document.getElementById('detailCloseBtn');

        // ==================== 工具 ====================
        function esc(s) {
            if (s == null) return '';
            return String(s).replace(/[&<>"]/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
            }[m]));
        }

        /** 把字节数转为可读文本 */
        function humanBytes(b) {
            if (b == null || b < 0) return '—';
            if (b < 1024) return b + ' B';
            if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
            if (b < 1024 * 1024 * 1024) return (b / 1024 / 1024).toFixed(1) + ' MB';
            return (b / 1024 / 1024 / 1024).toFixed(2) + ' GB';
        }

        /** ms 转时长 */
        function humanDuration(ms) {
            if (ms == null) return '—';
            if (ms < 1000) return ms + ' ms';
            const s = Math.floor(ms / 1000);
            if (s < 60) return s + ' s';
            const m = Math.floor(s / 60);
            if (m < 60) return m + ' m ' + (s % 60) + ' s';
            const h = Math.floor(m / 60);
            return h + ' h ' + (m % 60) + ' m';
        }

        // ==================== 卡片主值提取（关键：按 id 定制） ====================
        function pickPrimary(item) {
            const id = item.id;
            const rt = item.runtimeInfo || {};
            const ci = item.coreInfo || {};

            switch (id) {
                case 'cpu':
                    return rt.usedPercentText || (rt.cpuUsagePercent != null ? rt.cpuUsagePercent + '%' : '—');
                case 'memory':
                    return rt.usageText || (rt.usagePercent != null ? rt.usagePercent + '%' : '—');
                case 'disk': {
                    const parts = rt.partitions || [];
                    if (!parts.length) return '—';
                    // 取使用率最高的分区作为主值
                    const maxP = parts.reduce((a, b) =>
                        (a.usagePercent > b.usagePercent ? a : b));
                    return maxP.usagePercent + '%';
                }
                case 'process':
                    return (rt.totalProcesses != null ? rt.totalProcesses : '—') + ' 个';
                case 'thread':
                    return (rt.threadCount != null ? rt.threadCount : '—') + ' 个';
                case 'gpu':
                    return (ci.gpuCount != null ? ci.gpuCount : '—') + ' 个';
                case 'soundcard':
                    return (ci.deviceCount != null ? ci.deviceCount : '—') + ' 个';
                case 'filesystem': {
                    const stores = rt.stores || [];
                    return stores.length + ' 个挂载点';
                }
                case 'java':
                    return rt.loadedClassCount != null ? rt.loadedClassCount : '—';
                default:
                    // 通用回退
                    for (const k of ['usageText', 'usagePercent', 'threadCount', 'totalProcesses']) {
                        if (rt[k] != null) return rt[k];
                    }
                    return '—';
            }
        }

        /** 卡片副值（第二行小字） */
        function pickSub(item) {
            const id = item.id;
            const rt = item.runtimeInfo || {};
            const ci = item.coreInfo || {};

            switch (id) {
                case 'cpu':
                    return `核心 ${ci.cores || '?'} · ${ci.arch || ''}`;
                case 'memory':
                    return `${rt.usedText || '?'} / ${ci.totalText || '?'}`;
                case 'disk': {
                    const parts = rt.partitions || [];
                    if (!parts.length) return '';
                    return parts.map(p => p.path).join(' · ');
                }
                case 'process':
                    return `当前 PID ${rt.currentPid || '?'}`;
                case 'thread':
                    return `峰值 ${ci.peakThreadCount || '?'} · 守护 ${ci.daemonThreadCount || '?'}`;
                case 'gpu':
                    return (rt.gpuNames && rt.gpuNames[0]) || '';
                case 'soundcard':
                    return (rt.devices && rt.devices[0]) || '';
                case 'filesystem':
                    return ci.workDir || '';
                case 'java':
                    return ci.javaVersion || '';
                default:
                    return '';
            }
        }

        /** 获取进度值（0-100）用于卡片进度条；null 表示不显示 */
        function pickProgress(item) {
            const id = item.id;
            const rt = item.runtimeInfo || {};
            const ci = item.coreInfo || {};

            switch (id) {
                case 'cpu':     return rt.cpuUsagePercent;
                case 'memory':  return rt.usagePercent;
                case 'disk': {
                    const parts = rt.partitions || [];
                    if (!parts.length) return null;
                    return Math.max(...parts.map(p => p.usagePercent));
                }
                default: return null;
            }
        }

        // ==================== 渲染卡片 ====================
        function renderCards() {
            const filtered = currentCategory === 'ALL'
                ? allItems
                : allItems.filter(i => i.category === currentCategory);

            if (!filtered.length) {
                cardArea.innerHTML = '<div class="empty">📭 该分类下暂无组件</div>';
                return;
            }

            cardArea.innerHTML = filtered.map(item => {
                const primary = pickPrimary(item);
                const sub = pickSub(item);
                const progress = pickProgress(item);
                const hasBar = typeof progress === 'number' && !isNaN(progress);
                const barCls = hasBar && progress > 85 ? 'warn' : '';

                return `
                <div class="card status-${esc(item.status || 'OK')}" data-id="${esc(item.id)}">
                    <div class="card-head">
                        <div class="card-icon">${item.icon || '📦'}</div>
                        <div class="card-name">${esc(item.name)}</div>
                    </div>
                    <div class="card-primary">${esc(primary)}</div>
                    ${sub ? `<div class="card-sub">${esc(sub)}</div>` : ''}
                    ${hasBar ? `
                        <div class="card-bar">
                            <div class="card-bar-fill ${barCls}" style="width:${Math.min(100, progress)}%"></div>
                        </div>` : ''}
                    <div class="card-desc">${esc(item.description || '')}</div>
                    <div class="card-tag">${esc(item.category || '')}</div>
                </div>
            `;
            }).join('');

            cardArea.querySelectorAll('.card').forEach(el => {
                el.addEventListener('click', () => showDetail(el.dataset.id));
            });
        }

        // ==================== 分类计数 ====================
        function updateCategoryCounts() {
            const counts = { ALL: allItems.length, HARDWARE: 0, OS: 0, JAVA: 0, RUNTIME: 0 };
            allItems.forEach(i => { if (counts[i.category] != null) counts[i.category]++; });
            Object.entries(counts).forEach(([k, v]) => {
                const el = document.getElementById('cnt-' + k);
                if (el) el.textContent = v;
            });
        }

        // ==================== 详情渲染 ====================

        /** 通用 KV 表 */
        function renderKv(obj) {
            if (!obj || !Object.keys(obj).length) {
                return '<div style="color:#64748b; padding:12px; font-size:13px;">（无数据）</div>';
            }
            let html = '<table class="kv-table">';
            for (const [k, v] of Object.entries(obj)) {
                let vHtml;
                if (v == null) vHtml = '<span style="color:#64748b;">—</span>';
                else if (typeof v === 'object') vHtml = `<span style="color:#94a3b8;">${esc(JSON.stringify(v))}</span>`;
                else vHtml = esc(String(v));
                html += `<tr><td>${esc(k)}</td><td>${vHtml}</td></tr>`;
            }
            html += '</table>';
            return html;
        }

        /** 大进度条 */
        function renderBigBar(percent, label, valueText) {
            const pct = Math.max(0, Math.min(100, Number(percent) || 0));
            const cls = pct > 85 ? 'warn' : '';
            return `
            <div class="big-bar">
                <div class="big-bar-label">
                    <span>${esc(label)}</span>
                    <span class="val">${esc(valueText)}</span>
                </div>
                <div class="big-bar-track">
                    <div class="big-bar-fill ${cls}" style="width:${pct}%"></div>
                </div>
            </div>
        `;
        }

        /** 磁盘分区列表 */
        function renderDiskPartitions(partitions) {
            if (!partitions || !partitions.length) {
                return '<div class="empty" style="padding:20px;">无分区数据</div>';
            }
            let html = '<div class="part-list">';
            for (const p of partitions) {
                const pct = Math.max(0, Math.min(100, p.usagePercent || 0));
                const cls = pct > 85 ? 'warn' : '';
                html += `
                <div class="part-item">
                    <div class="part-head">
                        <span class="name">${esc(p.path)}</span>
                        <span class="info">${esc(p.usedText || '?')} / ${esc(p.totalText || '?')}</span>
                    </div>
                    <div class="big-bar-track">
                        <div class="big-bar-fill ${cls}" style="width:${pct}%"></div>
                    </div>
                    <div style="display:flex; justify-content:space-between; margin-top:6px;
                                font-size:11px; color:#94a3b8; font-family:monospace;">
                        <span>已用 ${pct.toFixed(1)}%</span>
                        <span>剩余 ${esc(p.freeText || '?')}</span>
                    </div>
                </div>
            `;
            }
            html += '</div>';
            return html;
        }

        /** 进程表 */
        function renderProcesses(list) {
            if (!list || !list.length) {
                return '<div class="empty" style="padding:20px;">无进程数据</div>';
            }
            let html = `
            <table class="proc-table">
                <thead>
                    <tr>
                        <th style="width:70px;">PID</th>
                        <th>命令</th>
                        <th style="width:120px;">用户</th>
                        <th style="width:100px; text-align:right;">CPU 累计</th>
                    </tr>
                </thead>
                <tbody>
        `;
            for (const p of list) {
                const curCls = p.current ? 'cur' : '';
                html += `
                <tr>
                    <td class="pid ${curCls}">${esc(p.pid)}${p.current ? ' ★' : ''}</td>
                    <td class="cmd" title="${esc(p.command)}">${esc(p.command)}</td>
                    <td style="font-size:11px; color:#94a3b8;">${esc(p.user)}</td>
                    <td class="cpu">${humanDuration(p.cpuDuration)}</td>
                </tr>
            `;
            }
            html += '</tbody></table>';
            return html;
        }

        /** 线程状态分布 */
        function renderThreadStates(dist) {
            if (!dist || !Object.keys(dist).length) {
                return '<div class="empty" style="padding:20px;">无状态数据</div>';
            }
            const clsMap = {
                'RUNNABLE': 'runnable',
                'WAITING': 'waiting',
                'TIMED_WAITING': 'timed',
                'BLOCKED': 'blocked'
            };
            let html = '<div class="state-grid">';
            for (const [state, count] of Object.entries(dist)) {
                const cls = clsMap[state] || '';
                html += `
                <div class="state-cell ${cls}">
                    <div class="lbl">${esc(state)}</div>
                    <div class="num">${esc(count)}</div>
                </div>
            `;
            }
            html += '</div>';
            return html;
        }

        /** 设备列表 */
        function renderDeviceList(arr) {
            if (!arr || !arr.length) {
                return '<div class="empty" style="padding:20px;">无设备数据</div>';
            }
            let html = '<ul class="device-list">';
            for (const d of arr) {
                html += `<li>${esc(d)}</li>`;
            }
            html += '</ul>';
            return html;
        }

        /** 文件系统挂载点 */
        function renderFileStores(stores) {
            if (!stores || !stores.length) {
                return '<div class="empty" style="padding:20px;">无挂载点</div>';
            }
            let html = '<div class="part-list">';
            for (const s of stores) {
                const total = s.total || 0;
                const usable = s.usable || 0;
                const used = total - usable;
                const pct = total > 0 ? Math.round(used / total * 10000) / 100 : 0;
                const cls = pct > 85 ? 'warn' : '';
                html += `
                <div class="part-item">
                    <div class="part-head">
                        <span class="name">${esc(s.name || '(根)')}</span>
                        <span class="info">${esc(s.type || '')} ${s.readOnly ? '· 只读' : ''}</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; margin:6px 0;
                                font-size:12px; font-family:monospace; color:#94a3b8;">
                        <span>已用 ${humanBytes(used)}</span>
                        <span>可用 ${humanBytes(usable)}</span>
                    </div>
                    <div class="big-bar-track">
                        <div class="big-bar-fill ${cls}" style="width:${pct}%"></div>
                    </div>
                </div>
            `;
            }
            html += '</div>';
            return html;
        }

        /** 详情主入口 */
        function showDetail(id) {
            const item = allItems.find(i => i.id === id);
            if (!item) return;

            detailTitle.innerHTML =
                `${item.icon || '📦'} ${esc(item.name)}
             <small style="font-size:12px; color:#94a3b8; font-weight:normal;">
                [${esc(item.category)}]
             </small>`;
            detailStatus.textContent = item.status || 'OK';
            detailStatus.className = 'status-badge ' + (item.status || 'OK');

            const ci = item.coreInfo || {};
            const rt = item.runtimeInfo || {};
            let body = '';

            // 顶部描述 + 时间
            body += `
            <div style="color:#94a3b8; font-size:13px; margin-bottom:16px;">
                ${esc(item.description || '')}
                <span style="float:right; font-family:monospace; font-size:11px;">
                    ${new Date(item.timestamp || Date.now()).toLocaleTimeString()}
                </span>
            </div>
        `;

            // ============ 按 id 定制渲染 ============
            if (id === 'cpu') {
                body += renderBigBar(rt.cpuUsagePercent, 'CPU 总使用率',
                    rt.usedPercentText || (rt.cpuUsagePercent + '%'));
                if (rt.processCpuUsagePercent != null) {
                    body += renderBigBar(rt.processCpuUsagePercent, '当前 JVM 进程 CPU 占用',
                        rt.processCpuUsagePercent + '%');
                }
                body += `<div class="section-title">📌 核心信息</div>${renderKv(ci)}`;
            }
            else if (id === 'memory') {
                body += renderBigBar(rt.usagePercent, '物理内存使用率',
                    rt.usageText || (rt.usagePercent + '%'));
                body += `<div class="section-title">📌 核心信息</div>${renderKv(ci)}`;
                body += `<div class="section-title">⚡ 运行时信息</div>${renderKv(rt)}`;
            }
            else if (id === 'disk') {
                body += `<div class="section-title">💿 分区使用情况</div>`;
                body += renderDiskPartitions(rt.partitions);
                body += `<div class="section-title">📌 核心信息</div>${renderKv(ci)}`;
            }
            else if (id === 'process') {
                body += `<div class="section-title">⚙️ 进程总览</div>`;
                body += renderKv({
                    totalProcesses: rt.totalProcesses,
                    currentPid: rt.currentPid
                });
                body += `<div class="section-title">🔥 CPU 占用 Top ${(rt.topProcesses || []).length}</div>`;
                body += renderProcesses(rt.topProcesses);
            }
            else if (id === 'thread') {
                body += `<div class="section-title">🧵 线程状态分布</div>`;
                body += renderThreadStates(rt.stateDistribution);
                body += `<div class="section-title">📌 核心信息</div>${renderKv(ci)}`;
                body += `<div class="section-title">⚡ 运行时信息</div>${renderKv({
                    threadCount: rt.threadCount,
                    deadlockedCount: rt.deadlockedCount
                })}`;
            }
            else if (id === 'gpu') {
                body += `<div class="section-title">🎮 GPU 设备</div>`;
                body += renderDeviceList(rt.gpuNames);
                body += `<div class="section-title">📌 核心信息</div>${renderKv(ci)}`;
            }
            else if (id === 'soundcard') {
                body += `<div class="section-title">🔊 音频设备</div>`;
                body += renderDeviceList(rt.devices);
                body += `<div class="section-title">📌 核心信息</div>${renderKv(ci)}`;
            }
            else if (id === 'filesystem') {
                body += `<div class="section-title">📁 文件系统挂载点</div>`;
                body += renderFileStores(rt.stores);
                body += `<div class="section-title">📌 核心信息</div>${renderKv(ci)}`;
            }
            else {
                // 通用回退：Java 运行时及其他自定义组件
                body += `<div class="section-title">📌 核心信息</div>${renderKv(ci)}`;
                body += `<div class="section-title">⚡ 运行时信息</div>${renderKv(rt)}`;
            }

            detailBody.innerHTML = body;
            overlay.style.display = 'flex';
        }

        function closeDetail() { overlay.style.display = 'none'; }

        // ==================== 数据采集 ====================
        async function fetchAll() {
            try {
                const resp = await fetch(API_BASE + '/all');
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const data = await resp.json();
                if (!Array.isArray(data)) {
                    throw new Error('返回数据格式错误，期望数组');
                }
                allItems = data;
                console.log('[SystemMonitor] 采集到', allItems.length, '个组件');
                renderCards();
                updateCategoryCounts();
                updateTime.textContent = '更新于 ' + new Date().toLocaleTimeString();
            } catch (e) {
                console.error('[SystemMonitor] 采集失败', e);
                cardArea.innerHTML = `<div class="error">
                ❌ 采集失败：${esc(e.message)}<br>
                <small style="color:#94a3b8;">
                    接口：${esc(API_BASE)}/all<br>
                    请按 F12 查看 Network / Console 详情
                </small>
            </div>`;
            }
        }

        // ==================== 定时器 ====================
        function startTimer() {
            stopTimer();
            const interval = parseInt(intervalSel.value) || 2000;
            timer = setInterval(() => { if (!paused) fetchAll(); }, interval);
        }
        function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

        // ==================== 事件绑定 ====================
        document.getElementById('categorySidebar').addEventListener('click', (e) => {
            const item = e.target.closest('.cat-item');
            if (!item) return;
            document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('active'));
            item.classList.add('active');
            currentCategory = item.dataset.category;
            renderCards();
        });

        pauseBtn.addEventListener('click', () => {
            paused = !paused;
            pauseBtn.textContent = paused ? '▶ 继续' : '⏸ 暂停';
            pauseBtn.classList.toggle('paused', paused);
        });

        refreshBtn.addEventListener('click', fetchAll);
        intervalSel.addEventListener('change', startTimer);

        detailClose.addEventListener('click', closeDetail);
        overlay.addEventListener('click', (e) => { if (e.target === overlay) closeDetail(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDetail(); });

        window.addEventListener('beforeunload', stopTimer);

        // ==================== 启动 ====================
        console.log('[SystemMonitor] 启动，API:', API_BASE);
        fetchAll();
        startTimer();
    })();
</script>
</body>
</html>
