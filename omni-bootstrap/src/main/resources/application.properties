# 服务器端口
server.port=28080

# 数据库配置
db.url=jdbc:mysql://localhost:3307/demo?useSSL=false&serverTimezone=UTC
db.username=root
db.password=123456
db.maxActive=20
db.maxIdle=10
db.minIdle=3
db.maxWaitMillis=30000
db.validationQuery=SELECT 1

# 包扫描路径
scan.packages=com.omni.**.controller,com.omni.**.service,com.omni.**.repository,com.omni.**.mapper,com.omni.**.component

# DispatcherServlet 全限定类名
servlet.class=com.omni.framework.spring.mvc.DispatcherServlet


# 上下文路径（支持配置，例如 /omni 或 /demo）
context.path=/omni

# ======== D:\work\git\omni\src\main\resources\application.properties ========
# 目录管理模块根路径配置
files.root.path=D:/temp

# ========== AI 后端配置 ==========
# 默认后端: ollama, deepseek, custom
ai.backend.default=ollama

# Ollama 配置
ollama.api.url=http://localhost:11434/api/chat

# DeepSeek 官方 API
deepseek.api.key=your_deepseek_api_key_here

# 自定义 API（开源工具地址）
custom.api.url=https://api.openai.com/v1/chat/completions
custom.api.key=your_custom_api_key_here

# ========== Playwright 自动化（DeepSeek 网页版）==========
# 默认关闭，避免服务器环境启动失败
playwright.enabled=true

# 项目助手知识库路径（相对类路径）
#project.assistant.kb.path=project_knowledge.json
project.assistant.kb.path=project_knowledge_keywords.json,project_knowledge.json,project_knowledge_10000.json
project.assistant.ngram.fallback=true

# OCR 训练数据路径
#ocr.tessdata.path=D:/work/tessdata


screenshot.assistant.autoShow=false


screenshot.save.dir=D:/my_screenshots


# ==================== 方法级调用链扫描配置 ====================

# 默认扫描根目录（可以是绝对路径或相对项目根目录的路径）
# Windows 示例：D:/work/git/code-stats/src/main/java
# Linux/Mac 示例：/home/user/projects/myapp/src/main/java
# 相对路径示例：./src/main/java
method.scan.rootDir=./src/main/java

# 是否在启动时预热扫描（true=启动就扫，false=首次访问时扫）
method.scan.preload=false

# 调用树默认最大深度
method.scan.defaultMaxDepth=5

# 单次扫描的最大文件数（防御性，避免扫到巨型仓库时 OOM）
method.scan.maxFiles=5000

# 是否跳过 test 目录
method.scan.excludeTest=true

# 额外排除的路径片段（逗号分隔）
method.scan.excludePaths=target,node_modules,.git,.idea,build,dist

# 单次缓存有效期（毫秒），0 表示永不失效
method.scan.cacheTtlMs=300000


# 是否启动截图助手（true/false），用于灵活控制桌面模式
screenshot.assistant.enabled=true


# ============ AI 文件导入 ============
# 允许写入的目标根目录（逗号分隔）；为空表示不限制（仅本地开发建议）
import.file.allowed-roots=D:/work/git/code-stats
# 单文件最大字节数（默认 1MB）
import.file.max-file-size=1048576
# 单次最多导入文件数（默认 1000）
import.file.max-files=1000


unzip.max-file-size=209715200
unzip.max-files=5000
unzip.max-total-bytes=1073741824


# 是否启用（默认 true）
server.home.redirect.enabled=true

# 重定向地址，支持三种写法：
#   1) 相对路径（推荐）：/demo/index.html
#      → 自动前缀 contextPath，如 /omni/demo/index.html
#   2) 已带 contextPath：/omni/demo/index.html
#      → 原样使用（避免重复拼 contextPath）
#   3) 完整 URL：https://example.com/home
#      → 原样使用（跨域跳转也可）
server.home.redirect.url=/demo/index.html

# 排除前缀（逗号分隔，命中则不做重定向，避免与 API 目录冲突）
# 例如访问 /agent/api/ 这类时仍会正常 404，而不是被误跳到首页
server.home.redirect.exclude-prefixes=/agent/api,/code/api,/files/api,/api


monitor.scheduler.enabled=false

# 只看系统监控的异常
systemmonitor.log.enabled=true
systemmonitor.log.level=error

# 访问日志总开关，默认 true（关掉所有访问日志用 false）
access.log.enabled=true
# 排除的路径前缀，逗号分隔；命中则不打印「连接建立/处理完成/匹配处理器」等访问日志
access.log.exclude-paths=/sys/api/log/read,/systemmonitor/api/,/3d/api/monitor-data,/3d/api/jstats/monitor,/3d/api/trace


# ============ 集群管理 ============
# 主服务对外可访问 URL（Worker 用它来注册），如果服务在局域网，请改成具体 IP
# 例如：cluster.master.url=http://192.168.1.100:28080/omni
 cluster.master.url=http://127.0.0.1:28080/omni

# ==================== 集群管理 ====================
# ★ 主节点 ID（必填，建议配置固定值）
#   未配置时启动期会临时生成随机 ID，并在日志中 warn；重启后该 ID 会变化，
#   之前注册的 Worker 会变成 UNKNOWN（因为 nodeId 不匹配），需要重新部署。
cluster.master.id=master-001

# ★ 主节点 Token（必填，Worker 注册 / 心跳 / 手动下载 共用同一把 token）
#   必须与 Worker 启动参数 --cluster.master.token=... 完全一致。
#   建议用足够长的随机串，例如 32 位 UUID 去掉短横线。
cluster.master.token=change-me-please-use-a-long-random-string

# 主服务对外可访问 URL（可选，不配则自动探测本机 IPv4）
# cluster.master.url=http://192.168.1.10:28080/omni



# ============================================================
# 静态资源根目录（webapps 父目录，含 demo/ agent/ files/ 等子目录）
# 多个用英文逗号分隔，按顺序探测，命中即用
# 支持 ${user.dir} / ${user.home} / ${java.io.tmpdir} 变量，支持相对路径（相对 user.dir）
# 未配置时使用内置默认候选
# ============================================================
webapps.roots=${user.dir}/webapps,${user.dir}/omni-bootstrap/webapps

# ============================================================
# fat jar 内 META-INF/app-resources/ 下需要 strip 掉的包装目录前缀
# 例如 jar 内是 META-INF/app-resources/omni-bootstrap/webapps/demo/index.html
# 配置此项后会解压到 user.dir/webapps/demo/index.html
# ============================================================
app.resources.strip-prefixes=omni-bootstrap

# ============================================================
# 代码分析：自动下探的包装目录名（逗号分隔，大小写敏感）
# 仅当 rootDir 下只有 1 个非 skip 子目录、且该目录名在此列表中时才会下探
# ============================================================
code.analysis.wrapper-dirs=omni-bootstrap

# 最多下探层数（防止误伤嵌套结构）
code.analysis.wrapper-max-depth=3