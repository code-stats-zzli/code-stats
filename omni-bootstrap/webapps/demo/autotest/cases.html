<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>用例管理</title>
    <link rel="stylesheet" href="../global-tech.css">
    <script src="../global.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: transparent; padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: auto; background: var(--bg-card); border-radius: 16px; padding: 24px; }
        h1 { color: var(--accent-primary); }
        .btn { padding: 6px 16px; border-radius: 20px; border: none; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .btn-primary { background: var(--accent-primary); color: white; }
        .btn-primary:hover { background: #0050cc; transform: translateY(-1px); }
        .btn-success { background: #22c55e; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-secondary { background: rgba(0,102,255,0.1); color: var(--accent-primary); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: var(--accent-primary); color: white; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid rgba(0,102,255,0.2); }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 16px; padding: 24px; width: 700px; max-width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal-content label { display: block; margin: 10px 0 4px; font-weight: 600; }
        .modal-content input, .modal-content select, .modal-content textarea { width: 100%; padding: 8px; border: 1px solid rgba(0,102,255,0.3); border-radius: 12px; }
        .modal-content .btn-group { text-align: right; margin-top: 20px; display: flex; justify-content: flex-end; gap: 8px; }
    </style>
</head>
<body>
<div class="container">
    <h1>📋 用例管理</h1>
    <button class="btn btn-primary" onclick="openCaseModal(null)">+ 新建用例</button>
    <table>
        <thead><tr><th>用例名称</th><th>编号</th><th>模块</th><th>优先级</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="caseTableBody"></tbody>
    </table>
</div>

<!-- 用例编辑弹窗 -->
<div id="caseModal" class="modal">
    <div class="modal-content">
        <h2 id="caseModalTitle">用例信息</h2>
        <input type="hidden" id="caseId">
        <input type="hidden" id="projectId">
        <label>用例名称</label>
        <input id="caseName" placeholder="请输入用例名称">
        <label>用例编号</label>
        <input id="caseCode" placeholder="可选，唯一">
        <label>模块路径</label>
        <input id="modulePath" placeholder="如：用户管理/登录">
        <label>优先级</label>
        <select id="priority"><option value="1">高</option><option value="2" selected>中</option><option value="3">低</option></select>
        <label>环境</label>
        <select id="envType"><option value="1">测试</option><option value="2">预发</option><option value="3">生产</option></select>
        <label>浏览器</label>
        <select id="browserType"><option value="chrome">Chrome</option><option value="firefox">Firefox</option><option value="edge">Edge</option></select>
        <label>基础URL</label>
        <input id="baseUrl" placeholder="https://example.com">
        <label>超时(秒)</label>
        <input id="timeoutSec" type="number" value="30">
        <label>重试次数</label>
        <input id="retryTimes" type="number" value="0">
        <label>状态</label>
        <select id="status"><option value="1">启用</option><option value="0">禁用</option></select>
        <label>标签</label>
        <input id="tags" placeholder="smoke,regression">
        <div class="btn-group">
            <button class="btn btn-primary" onclick="saveCase()">保存</button>
            <button class="btn btn-secondary" onclick="closeCaseModal()">取消</button>
        </div>
    </div>
</div>

<script>
    (function() {
        let projectId = new URLSearchParams(window.location.search).get('projectId') || '';

        // API 路径映射到 Controller
        const API_LIST = window.apiUrl('/autotest/api/case/cases');
        const API_GET = window.apiUrl('/autotest/api/case/get');
        const API_SAVE = window.apiUrl('/autotest/api/case/save');
        const API_DELETE = window.apiUrl('/autotest/api/case/delete');
        const API_EXECUTE = window.apiUrl('/autotest/api/execute/execute');
        const API_EXECUTIONS = window.apiUrl('/autotest/api/execute/executions');

        async function loadCases() {
            const resp = await fetch(API_LIST + '?projectId=' + projectId);
            const data = await resp.json();
            const tbody = document.getElementById('caseTableBody');
            tbody.innerHTML = data.map(c => `
                <tr data-id="${c.id}">
                    <td>${escapeHtml(c.caseName)}</td>
                    <td>${escapeHtml(c.caseCode || '')}</td>
                    <td>${escapeHtml(c.modulePath || '')}</td>
                    <td>${c.priority === 1 ? '高' : c.priority === 2 ? '中' : '低'}</td>
                    <td>${c.status === 1 ? '启用' : '禁用'}</td>
                    <td>
                        <button class="btn btn-secondary" onclick="editCase('${c.id}')">编辑</button>
                        <button class="btn btn-success" onclick="executeCase('${c.id}')">执行</button>
                        <button class="btn btn-primary" onclick="viewExecutions('${c.id}')">报告</button>
                    </td>
                </tr>
            `).join('');
        }

        window.openCaseModal = function(caseData) {
            document.getElementById('caseModal').style.display = 'flex';
            document.getElementById('caseId').value = caseData?.id || '';
            document.getElementById('projectId').value = projectId;
            document.getElementById('caseName').value = caseData?.caseName || '';
            document.getElementById('caseCode').value = caseData?.caseCode || '';
            document.getElementById('modulePath').value = caseData?.modulePath || '';
            document.getElementById('priority').value = caseData?.priority || 2;
            document.getElementById('envType').value = caseData?.envType || 1;
            document.getElementById('browserType').value = caseData?.browserType || 'chrome';
            document.getElementById('baseUrl').value = caseData?.baseUrl || '';
            document.getElementById('timeoutSec').value = caseData?.timeoutSec || 30;
            document.getElementById('retryTimes').value = caseData?.retryTimes || 0;
            document.getElementById('status').value = caseData?.status || 1;
            document.getElementById('tags').value = caseData?.tags || '';
            document.getElementById('caseModalTitle').innerText = caseData?.id ? '编辑用例' : '新建用例';
        };

        window.closeCaseModal = function() {
            document.getElementById('caseModal').style.display = 'none';
        };

        window.saveCase = async function() {
            const data = {
                id: document.getElementById('caseId').value,
                projectId: document.getElementById('projectId').value,
                caseName: document.getElementById('caseName').value,
                caseCode: document.getElementById('caseCode').value,
                modulePath: document.getElementById('modulePath').value,
                priority: parseInt(document.getElementById('priority').value),
                envType: parseInt(document.getElementById('envType').value),
                browserType: document.getElementById('browserType').value,
                baseUrl: document.getElementById('baseUrl').value,
                timeoutSec: parseInt(document.getElementById('timeoutSec').value),
                retryTimes: parseInt(document.getElementById('retryTimes').value),
                status: parseInt(document.getElementById('status').value),
                tags: document.getElementById('tags').value
            };
            await fetch(API_SAVE, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            closeCaseModal();
            loadCases();
        };

        window.editCase = function(id) {
            fetch(API_GET + '?id=' + id)
                .then(res => res.json())
                .then(c => openCaseModal(c))
                .catch(() => alert('获取用例信息失败'));
        };

        window.executeCase = async function(caseId) {
            const resp = await fetch(API_EXECUTE, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ caseId, triggerUser: 'admin' })
            });
            const result = await resp.json();
            alert('执行完成，状态：' + (result.status === 1 ? '✅ 通过' : '❌ 失败') + '，通过率：' + result.passRate + '%');
            loadCases();
        };

        window.viewExecutions = function(caseId) {
            if (window.parent && window.parent.document) {
                const container = window.parent;
                const targetTab = container.document.querySelector('#subTabContainer .topbar-tab[data-tab="reports"]');
                if (targetTab) targetTab.click();
                const iframe = container.document.getElementById('panel-reports').querySelector('iframe');
                iframe.src = 'reports.html?caseId=' + caseId;
            } else {
                window.location.href = 'reports.html?caseId=' + caseId;
            }
        };

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
        }

        document.getElementById('caseModal').addEventListener('click', function(e) {
            if (e.target === this) closeCaseModal();
        });

        if (projectId) {
            loadCases();
        } else {
            document.getElementById('caseTableBody').innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">请从项目管理选择项目</td></tr>';
        }
    })();
</script>
</body>
</html>
