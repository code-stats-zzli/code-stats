<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自动化测试平台</title>
    <link rel="stylesheet" href="../global-tech.css">
    <script src="../global.js"></script>
    <style>
        .autotest-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: transparent;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            height: 56px;
            margin: 8px 16px 0;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            border: 1px solid rgba(0,102,255,0.25);
            flex-shrink: 0;
        }
        .topbar-brand {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-primary);
        }
        .topbar-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .topbar-tabs::-webkit-scrollbar {
            display: none;
        }
        .topbar-tab {
            background: transparent;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-muted);
            white-space: nowrap;
        }
        .topbar-tab:hover {
            background: rgba(0,102,255,0.1);
            color: var(--accent-primary);
        }
        .topbar-tab.active {
            background: var(--accent-primary);
            color: white;
            box-shadow: 0 0 12px var(--accent-primary);
        }
        .main-content {
            flex: 1;
            margin: 8px 16px 16px;
            overflow: hidden;
            border-radius: 20px;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0,102,255,0.25);
        }
        .tab-panel {
            display: none;
            width: 100%;
            height: 100%;
        }
        .tab-panel.active {
            display: block;
        }
        .tab-panel iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }
    </style>
</head>
<body>
<div class="autotest-container">
    <header class="topbar">
        <div class="topbar-brand">⚡ 自动化测试</div>
        <nav class="topbar-tabs" id="subTabContainer">
            <button class="topbar-tab active" data-tab="projects">📁 项目管理</button>
            <button class="topbar-tab" data-tab="cases">📋 用例管理</button>
            <button class="topbar-tab" data-tab="execute">🚀 执行中心</button>
            <button class="topbar-tab" data-tab="reports">📊 报告中心</button>
        </nav>
        <div style="font-size:12px;color:var(--text-muted);">v1.0</div>
    </header>
    <main class="main-content">
        <div class="tab-panel active" id="panel-projects">
            <iframe src="projects.html" title="项目管理"></iframe>
        </div>
        <div class="tab-panel" id="panel-cases">
            <iframe src="cases.html" title="用例管理"></iframe>
        </div>
        <div class="tab-panel" id="panel-execute">
            <iframe src="execute.html" title="执行中心"></iframe>
        </div>
        <div class="tab-panel" id="panel-reports">
            <iframe src="reports.html" title="报告中心"></iframe>
        </div>
    </main>
</div>

<script>
    (function() {
        const tabs = document.querySelectorAll('#subTabContainer .topbar-tab');
        const panels = {
            projects: document.getElementById('panel-projects'),
            cases: document.getElementById('panel-cases'),
            execute: document.getElementById('panel-execute'),
            reports: document.getElementById('panel-reports')
        };

        function switchTab(tabId) {
            tabs.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tabId);
            });
            Object.keys(panels).forEach(key => {
                panels[key].classList.toggle('active', key === tabId);
            });
            // 通知父窗口更新状态（可选）
            if (window.parent && window.parent.postMessage) {
                window.parent.postMessage({ type: 'autotestTabChange', tab: tabId }, '*');
            }
        }

        tabs.forEach(btn => {
            btn.addEventListener('click', function() {
                const tabId = this.dataset.tab;
                if (tabId) switchTab(tabId);
            });
        });

        // 从 URL hash 初始化
        const hash = window.location.hash.replace('#', '');
        if (hash && panels[hash]) switchTab(hash);
        window.addEventListener('hashchange', function() {
            const h = window.location.hash.replace('#', '');
            if (h && panels[h]) switchTab(h);
        });
    })();
</script>
</body>
</html>
