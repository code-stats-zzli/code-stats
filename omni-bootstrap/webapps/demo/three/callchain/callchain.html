<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>系统服务调用链 3D 拓扑图</title>
    <link rel="stylesheet" href="callchain.css" />
    <!-- 使用 import map 引入 Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
<div id="app">
    <header class="header">
        <h1>🔗 系统服务调用链 3D 拓扑</h1>
        <div class="controls">
            <button id="switchSystemBtn" class="btn active">🔗 系统全链路</button>
            <button id="switchProjectBtn" class="btn">📂 项目调用链</button>
            <button id="refreshBtn" class="btn">🔄 刷新</button>
            <span id="status" class="status">就绪</span>
        </div>
    </header>
    <div id="canvas-container">
        <div id="loading-overlay">
            <div class="spinner"></div>
            <div id="loading-text">正在加载调用链数据...</div>
            <div id="error-msg" class="error-msg" style="display:none;"></div>
        </div>
        <!-- Three.js 画布将插入此处 -->
    </div>
    <div class="legend">
        <div class="legend-item">
            <span class="color-dot controller"></span> Controller
        </div>
        <div class="legend-item">
            <span class="color-dot service"></span> Service
        </div>
        <div class="legend-item">
            <span class="color-dot mapper"></span> Mapper
        </div>
        <div class="legend-item">
            <span class="color-dot class"></span> 其他类
        </div>
        <div class="legend-item">
            <span class="arrow-line">→</span> 调用方向
        </div>
    </div>
    <div class="hint">🖱 拖拽旋转 · 滚轮缩放 · 悬停查看类名</div>
</div>

<script type="module" src="callchain.js"></script>
</body>
</html>
