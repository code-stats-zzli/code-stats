# 服务器端口
server.port=8080

# 数据库配置
db.url=jdbc:mysql://localhost:3306/demo?useSSL=false&serverTimezone=UTC
db.username=root
db.password=123456
db.maxActive=20
db.maxIdle=10
db.minIdle=3
db.maxWaitMillis=30000
db.validationQuery=SELECT 1

# 包扫描路径
scan.packages=com.codestats.**.controller,com.codestats.**.service,com.codestats.**.repository,com.codestats.**.mapper,com.codestats.**.component

# DispatcherServlet 全限定类名
servlet.class=com.framework.spring.mvc.DispatcherServlet