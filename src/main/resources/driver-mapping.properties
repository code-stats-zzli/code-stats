# 格式: 数据库类型.版本 = 驱动编码|驱动类名
mysql.5.7 = mysql-connector-5.7|com.mysql.jdbc.Driver
mysql.8.0 = mysql-connector-8.0|com.mysql.cj.jdbc.Driver
oracle.11g = ojdbc6|oracle.jdbc.driver.OracleDriver
oracle.12c = ojdbc8|oracle.jdbc.driver.OracleDriver
postgresql.10 = postgresql-42.2|org.postgresql.Driver
postgresql.14 = postgresql-42.5|org.postgresql.Driver