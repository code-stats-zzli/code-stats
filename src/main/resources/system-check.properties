# ============================================================
# 系统检查配置文件
# ============================================================

# 默认并发线程数
system-check.thread-count=4

# 风险端口（监听即告警）
system-check.risk-ports=21,22,23,25,53,80,110,135,137,138,139,143,443,445,1433,1521,3306,3389,5432,5900,6379,9042,9092,9200,9300,11211,27017,2375,8080,8443,8888,5000,5001

# 高危必需入站阻断的端口
system-check.risk-req-ports=21,23,135,137,138,139,445,3306,3389,6379

# ============================================================
# 各检查项开关（true=启用，false=禁用）
# ============================================================
system-check.check.system-info.enabled=true
system-check.check.firewall.enabled=true
system-check.check.port.enabled=true
system-check.check.rdp.enabled=true
system-check.check.lock-screen.enabled=true
system-check.check.credentials.enabled=true
system-check.check.archive.enabled=true
system-check.check.plaintext-scan.enabled=true
system-check.check.dependency-vuln.enabled=true
system-check.check.endpoint-security.enabled=true

# 明文密码扫描参数
system-check.plaintext-scan.max-file-size=15728640
system-check.plaintext-scan.max-doc-size=3145728

# 依赖漏洞扫描参数
system-check.dependency-vuln.max-depth=8