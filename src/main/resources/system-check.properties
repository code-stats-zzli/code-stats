# ============================================================
# 系统检查配置文件
# ============================================================

# 默认并发线程数
system-check.thread-count=4

# ============================================================
# 模块开关
# ============================================================
system-check.check.system-info.enabled=true
system-check.check.firewall.enabled=true
system-check.check.port.enabled=true
system-check.check.rdp.enabled=true
system-check.check.lock-screen.enabled=true
system-check.check.credentials.enabled=true
system-check.check.archive.enabled=true
system-check.check.plaintext-scan.enabled=true
system-check.check.dependency-vuln.enabled=true
system-check.check.endpoint-security.enabled=true

# ============================================================
# 端口模块 (port)
# ============================================================
system-check.port.riskPorts=21,22,23,25,53,80,110,135,137,138,139,143,443,445,1433,1521,3306,3389,5432,5900,6379,9042,9092,9200,9300,11211,27017,2375,8080,8443,8888,5000,5001
system-check.port.riskReqPorts=21,23,135,137,138,139,445,3306,3389,6379

# ============================================================
# 明文密码扫描模块 (plaintext-scan)
# ============================================================
system-check.plaintext-scan.maxFileSize=15728640
system-check.plaintext-scan.maxDocSize=3145728
system-check.plaintext-scan.passwordKeywords=password,passwd,pwd,access_key,accessKey,api_key,apiKey,private_key,privateKey,密钥,密码,口令,账号,账户,secret,token,credential
system-check.plaintext-scan.textExtensions=.txt,.md,.csv,.env,.gitconfig,.npmrc,.properties,.yml,.yaml,.ini,.conf,.config,.toml,.cnf,.xml,.json,.sql,.sh,.bat,.ps1,.gradle
system-check.plaintext-scan.docExtensions=.doc,.xls,.docx,.xlsx,.pdf
system-check.plaintext-scan.skipDirs=node_modules,.git,.idea,.gradle,target,build,.m2,.cache,.npm,.vscode
system-check.plaintext-scan.skipKeywords=弱口令,口令字典,Telnet,README,扫描,检测,匹配,说明,密码规则,示例,example,sample,placeholder
# 密码赋值正则（Java 正则，注意 properties 中需双反斜杠转义）
system-check.plaintext-scan.assignRegex=(?i)(password|passwd|pwd|access[_]?key|api[_]?key|private[_]?key|密钥|密码|口令|账号|账户|secret|token|credential)\\s*[:=：]\\s*\\S+
# 占位符规则：{xxx}, <xxx>, [xxx] 视为占位符跳过
system-check.plaintext-scan.placeholderBrackets={},<>,()

# ============================================================
# 压缩包/安装包模块 (archive)
# ============================================================
system-check.archive.minSizeMB=2
system-check.archive.scanDirs=Desktop,Downloads
system-check.archive.archiveExtensions=.exe,.msi,.zip,.rar,.7z,.iso
system-check.archive.openSourcePattern=(?i).*(git-|node-|nodejs|openjdk|jdk|vscode|visualstudiocode|firefox|7-zip|7zip|winscp|filezilla|putty|python|golang|rust|dbeaver|heidisql|pgadmin|mariadb|postgresql|redis|elasticsearch|docker|kubernetes|anaconda|miniconda|vlc|notepad\\+\\+|gimp|libreoffice|inkscape|audacity|blender|obs|ffmpeg|cmake|gradle|maven|apache|tomcat|nginx|chromium|thunderbird|keepass).*

# ============================================================
# 凭据/软件模块 (credentials)
# ============================================================
system-check.credentials.credentialFiles=.git-credentials,.npmrc,.m2/settings.xml,.kube/config,.docker/config.json,.pip/pip.conf,.ssh/id_rsa,.ssh/id_ed25519,.aws/credentials,.azure/accessTokens.json
system-check.credentials.browserDirsWin=AppData/Local/Google/Chrome/User Data,AppData/Local/Microsoft/Edge/User Data,AppData/Roaming/Mozilla/Firefox
system-check.credentials.browserDirsLinux=.mozilla/firefox,.config/google-chrome,/opt/kingsoft/browser
system-check.credentials.commercialPattern=(?i)Navicat|Xshell|SecureCRT|PL/SQL|DataGrip|dbForge|MobaXterm|Termius|Beyond\\s+Compare|VMware\\s+Workstation|SQLyog|Toad|UltraEdit|WinRAR|WinZip|TeamViewer|IDM

# ============================================================
# 跨网/无线/U盘模块 (endpoint-security)
# ============================================================
system-check.endpoint-security.crossNetPattern=(?i)TeamViewer|AnyDesk|ToDesk|向日葵|Sunlogin|RustDesk|灰鸽子|pcAnywhere|RealVNC|TightVNC|UltraVNC|frp|ngrok|nps|cpolar|花生壳|nat123|ZeroTier|Tailscale|Shadowsocks|ShadowRocket|v2ray|Clash|Trojan|WireGuard|OpenVPN|SoftEther|AnyConnect|360WiFi|猎豹WiFi|共享精灵|Connectify|MyPublicWiFi|蓝灯|Lantern|ExpressVPN|Surge|Quantumult|Proxifier|SocksCap|FreeCap|Proxyee
system-check.endpoint-security.wifiPattern=(?i)wireless|802\\.11|wi-?fi|wlan

# ============================================================
# 依赖漏洞扫描模块 (dependency-vuln)
# ============================================================
system-check.dependency-vuln.maxDepth=8
system-check.dependency-vuln.manifestFiles=pom.xml,build.gradle,build.gradle.kts,package.json,requirements.txt,go.mod
system-check.dependency-vuln.skipDirs=node_modules,.git,.idea,.gradle,target,build,.m2,.cache,.npm

# ★ 自定义漏洞库（多行，每行一条，格式：name|eco|minVer|fixVer|cve|desc）
# 与内置漏洞库合并，同名同版本同 CVE 会自动去重
system-check.dependency-vuln.customVulnDb=