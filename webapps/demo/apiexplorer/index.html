<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Explorer - 接口调试 / 自定义 API</title>
    <link rel="stylesheet" href="../global-tech.css">
    <link rel="stylesheet" href="apiexplorer.css">
    <script src="../global.js"></script>
</head>
<body>
<div class="apiexplorer-wrap">

    <!-- ============ 顶级 Tab 栏 ============ -->
    <div class="top-tab-bar">
        <button class="top-tab active" data-top-tab="debug">
            <span class="tab-icon">🔧</span><span>接口调试</span>
        </button>
        <button class="top-tab" data-top-tab="custom">
            <span class="tab-icon">📚</span><span>自定义 API</span>
        </button>
    </div>

    <!-- ============ 接口调试面板（原有逻辑） ============ -->
    <div class="top-tab-pane active" id="paneDebug">
        <aside class="api-sidebar">
            <div class="sidebar-header">
                <h3>📡 API 列表</h3>
                <div class="search-box">
                    <input type="text" id="apiSearch" placeholder="搜索接口...">
                </div>
            </div>
            <div class="api-tree-wrapper">
                <ul class="api-tree" id="apiTree">
                    <li class="loading">加载中...</li>
                </ul>
            </div>
        </aside>
        <main class="api-content">
            <div id="apiDetail" class="api-detail">
                <div class="empty-state">
                    <span class="empty-icon">🔍</span>
                    <p>从左侧选择一个接口</p>
                </div>
            </div>
        </main>
    </div>

    <!-- ============ 自定义 API 面板（新增） ============ -->
    <div class="top-tab-pane" id="paneCustom">
        <aside class="custom-sidebar">
            <div class="custom-sidebar-header">
                <h3>📚 已发布 API</h3>
                <button id="newApiBtn" class="btn-primary btn-sm">＋ 发布新 API</button>
            </div>
            <div class="custom-api-list" id="customApiList">
                <div class="loading">加载中...</div>
            </div>
        </aside>
        <main class="custom-main" id="customMain">
            <div class="empty-state">
                <span class="empty-icon">📝</span>
                <p>点击左侧「+ 发布新 API」开始，或选择已发布 API 查看详情</p>
            </div>
        </main>
    </div>
</div>

<!-- ============ API 测试弹窗（保留） ============ -->
<div id="apiTestModal" class="api-test-modal" style="display:none;">
    <div class="api-test-modal-content">
        <div class="api-test-modal-header">
            <span id="apiTestModalTitle">⚡ 测试 API</span>
            <span class="api-test-modal-close" id="apiTestModalClose">×</span>
        </div>
        <div class="api-test-modal-body">
            <div id="apiTestMeta" class="api-test-meta"></div>
            <div id="apiTestForm" class="api-test-form">
                <div class="empty-tip">加载中...</div>
            </div>
            <div id="apiTestResultWrap" class="api-test-result-wrap" style="display:none;">
                <div class="api-test-result-header">
                    <span>📤 调用结果</span>
                    <span id="apiTestResultStatus" class="api-test-result-status"></span>
                </div>
                <pre id="apiTestResultContent" class="api-test-result-content"></pre>
            </div>
        </div>
        <div class="api-test-modal-footer">
            <button id="apiTestInvokeBtn" class="send-btn" disabled>🚀 调用</button>
            <button id="apiTestCancelBtn" class="btn-secondary">关闭</button>
        </div>
    </div>
</div>

<script src="apiexplorer.js"></script>
<script src="custom-request.js"></script>
</body>
</html>
