<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可视化页面搭建器</title>
    <link rel="stylesheet" href="builder.css">
</head>
<body>
<div class="builder-app">
    <!-- 顶部工具栏 -->
    <header class="builder-toolbar" id="toolbar"></header>

    <div class="builder-body">
        <!-- 左侧：+ 按钮 + 抽屉 -->
        <aside class="builder-left">
            <button class="add-fab" id="addFab" title="添加元素">＋</button>
            <div class="element-drawer" id="elementDrawer">
                <div class="drawer-header">
                    <span>元素库</span>
                    <button class="drawer-close" id="drawerClose">✖</button>
                </div>
                <div class="drawer-body" id="elementPanel"></div>
            </div>
        </aside>

        <!-- 中间：画布 -->
        <main class="builder-canvas-wrapper">
            <div class="canvas-ruler-top"></div>
            <div class="builder-canvas" id="canvas">
                <div class="canvas-hint">从左侧拖拽元素到此区域</div>
            </div>
        </main>

        <!-- 右侧：属性面板 -->
        <aside class="builder-right" id="propertyPanel"></aside>
    </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
