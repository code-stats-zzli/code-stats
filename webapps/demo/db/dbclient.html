<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Database Explorer - 基于数据源</title>
    <link rel="stylesheet" href="../global-tech.css">
    <link rel="stylesheet" href="dbclient.css">
    <script src="../global.js"></script>
</head>
<body>
<div class="db-layout">
    <div class="db-toolbar">
        <div class="db-selector">
            <label>数据源：</label>
            <select id="dataSourceSelect" style="min-width: 220px;"></select>
            <div class="dropdown" id="manageDropdown">
                <button class="btn-secondary dropdown-toggle">⚙️ 管理</button>
                <div class="dropdown-menu">
                    <a href="#" data-action="datasource">📋 数据源配置</a>
                    <a href="#" data-action="driver">🔌 驱动配置</a>
                </div>
            </div>
        </div>
    </div>

    <div class="db-main-row">
        <!-- 左侧表列表 -->
        <div class="table-list-panel" id="tableListPanel">
            <h3>📋 表列表</h3>
            <!-- ★ 只读数据库展示（数据源自带，不可修改） -->
            <div class="db-info-inline" id="dbInfoInline" style="display:none;">
                <span class="db-info-label">数据库：</span>
                <span class="db-info-value" id="dbInfoValue">-</span>
            </div>
            <div class="table-filter-inline">
                <input type="text" id="tableFilter" placeholder="输入表名过滤...">
            </div>
            <div id="tableListContainer" class="table-list"></div>
        </div>

        <!-- 右侧内容区 -->
        <div class="content-panel">
            <div class="tab-header">
                <button class="tab-btn active" data-tab="properties">属性</button>
                <button class="tab-btn" data-tab="data">数据</button>
                <button class="tab-btn" data-tab="diagram">图</button>
                <button class="tab-btn" data-tab="sql">SQL查询</button>
            </div>
            <div class="tab-content">
                <div class="tab-pane active" id="tab-properties">
                    <div id="propertiesContent"><h2>请从左侧选择一张表</h2></div>
                </div>
                <div class="tab-pane" id="tab-data">
                    <div id="dataContent">
                        <div id="dataTableWrapper"></div>
                        <div id="paginationBar" style="margin-top: 16px;"></div>
                    </div>
                </div>
                <div class="tab-pane" id="tab-diagram">
                    <div class="diagram-simple-container">
                        <div class="canvas-area">
                            <div id="diagramCanvasContainer" class="canvas-container">
                                <svg id="diagramSvg" width="100%" height="100%"></svg>
                                <div id="diagramPlaceholder" class="canvas-placeholder">拖拽左侧表至此处生成视图</div>
                            </div>
                        </div>
                        <div id="sqlViewPanel" class="sql-preview-panel">
                            <div class="sql-header">
                                <strong>📄 当前视图 SQL</strong>
                                <div>
                                    <button id="copySqlBtn" class="btn-secondary">📋 复制</button>
                                    <button id="executeSqlBtnView" class="btn-primary">🚀 执行</button>
                                </div>
                            </div>
                            <textarea id="viewSqlText" readonly rows="4"></textarea>
                        </div>
                    </div>
                </div>
                <div class="tab-pane" id="tab-sql">
                    <div class="sql-editor">
                        <div style="margin-bottom: 8px; display: flex; gap: 8px;">
                            <button id="exampleSqlBtn" class="btn-secondary">📋 示例SQL</button>
                            <button id="executeSqlBtn" class="btn-primary">🚀 执行查询</button>
                            <button id="formatSqlBtn" class="btn-secondary">✨ 格式化</button>
                            <button id="clearSqlBtn" class="btn-secondary">🗑️ 清空</button>
                        </div>
                        <textarea id="sqlEditor" rows="6" placeholder="输入SQL查询语句..."></textarea>
                        <div id="sqlResultArea" style="margin-top: 16px; overflow-x: auto;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 右键菜单 -->
<div id="contextMenu" class="context-menu" style="display:none;">
    <ul style="list-style: none; margin: 0; padding: 4px 0;">
        <li data-action="viewData" class="context-item">📊 查看数据</li>
        <li data-action="viewStructure" class="context-item">📐 查看结构</li>
        <li data-action="fieldTransform" class="context-item">⚙️ 字段转换（弹窗）</li>
        <li data-action="deleteTable" class="context-item">❌ 删除表视图</li>
    </ul>
</div>

<!-- 字段转换弹窗 -->
<div id="transformModal" class="modal" style="display:none;">
    <div class="modal-content" style="width: 80%; max-width: 1000px;">
        <div class="modal-header">
            <span>⚙️ 字段转换配置</span>
            <span class="close-modal" id="closeModalBtn">&times;</span>
        </div>
        <div class="modal-body" style="display: flex; gap: 20px; min-height: 400px;">
            <div style="flex:1; border-right: 1px solid #e2e8f0; padding-right: 16px;">
                <h4>📋 源字段（可拖拽）</h4>
                <div id="modalSourceFields" class="source-fields-list" style="max-height: 400px; overflow-y: auto;"></div>
            </div>
            <div style="flex:2;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h4>🔄 转换规则</h4>
                    <button id="addModalRuleBtn" class="icon-btn">+ 添加规则</button>
                </div>
                <div id="modalTransformList" class="transform-fields-list" style="max-height: 400px; overflow-y: auto;"></div>
                <div class="function-bar" style="margin-top: 16px;">
                    <span>常用函数：</span>
                    <button data-func="UPPER({field})">UPPER</button>
                    <button data-func="LOWER({field})">LOWER</button>
                    <button data-func="CONCAT({field}, ' ')">CONCAT</button>
                    <button data-func="LENGTH({field})">LENGTH</button>
                    <button data-func="YEAR({field})">YEAR</button>
                    <button data-func="ROUND({field},2)">ROUND</button>
                    <button data-func="IFNULL({field},0)">IFNULL</button>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button id="applyModalBtn" class="btn-primary">生成转换节点</button>
            <button id="cancelModalBtn" class="btn-secondary">取消</button>
        </div>
    </div>
</div>

<script src="dbclient-core.js"></script>
<script src="dbclient-properties.js"></script>
<script src="dbclient-data.js"></script>
<script src="dbclient-sql-enhanced.js"></script>
<script src="dbclient-db.js"></script>
<script src="view/dbclient-view-core.js"></script>
<script src="view/dbclient-view-drag.js"></script>
<script src="view/dbclient-view-modal.js"></script>
<script src="view/dbclient-view-transform.js"></script>
<script src="view/dbclient-view-sql.js"></script>
<script src="view/dbclient-view.js"></script>

<script>
    (function() {
        function initAll() {
            PropertiesModule.init();
            DataModule.init();
            if (window.DBModule && typeof window.DBModule.init === 'function') {
                window.DBModule.init();
            }
            if (window.ViewModule && typeof window.ViewModule.init === 'function') {
                window.ViewModule.init();
            }
            // 初始化数据源（会触发绑定数据库 + 表列表加载）
            if (typeof loadDataSources === 'function') loadDataSources();

            const tabBtns = document.querySelectorAll('.tab-btn');
            const tabPanes = document.querySelectorAll('.tab-pane');
            function switchTab(tabName) {
                tabBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tabName));
                tabPanes.forEach(pane => pane.classList.toggle('active', pane.id === `tab-${tabName}`));
                if (tabName === 'data' && DB.getCurrentTable()) DataModule.loadTableData();
                if (tabName === 'diagram' && window.ViewModule) {
                    window.ViewModule.refreshCanvasSize();
                    window.ViewModule.updateCurrentViewSql();
                }
            }
            tabBtns.forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initAll);
        else initAll();
    })();
</script>
</body>
</html>
