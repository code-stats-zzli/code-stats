<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>驱动管理 - CodeStats</title>
    <link rel="stylesheet" href="../global-tech.css">
    <link rel="stylesheet" href="driver-manager.css">
    <script src="../global.js"></script>
</head>
<body>
<div class="container">
    <div class="toolbar">
        <button id="uploadBtn" class="btn-primary">+ 上传驱动</button>
    </div>
    <table id="driverTable">
        <thead>
        <tr><th>驱动编码</th><th>驱动名称</th><th>文件名</th><th>上传时间</th><th>操作</th></tr>
        </thead>
        <tbody id="driverTableBody"></tbody>
    </table>
</div>

<!-- 上传/编辑弹窗 -->
<div id="modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">上传驱动</h3>
            <span class="close">&times;</span>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>驱动编码 *</label>
                <input type="text" id="code" placeholder="例如: mysql-connector-8.0">
            </div>
            <div class="form-group">
                <label>驱动名称 *</label>
                <input type="text" id="name" placeholder="例如: MySQL Connector 8.0">
            </div>
            <div class="form-group" id="fileGroup">
                <label>Jar 文件 *</label>
                <input type="file" id="jarFile" accept=".jar">
            </div>
            <input type="hidden" id="editId">
        </div>
        <div class="modal-footer">
            <button id="saveBtn" class="btn-primary">保存</button>
            <button id="cancelBtn" class="btn-secondary">取消</button>
        </div>
    </div>
</div>
<script src="driver-manager.js"></script>
</body>
</html>
