<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>目录管理 - CodeStats</title>
    <script src="../global.js"></script>
    <link rel="stylesheet" href="../global-tech.css">
    <link rel="stylesheet" href="files.css">
</head>
<body>
<div class="files-container">
    <aside class="files-sidebar">
        <div class="sidebar-header">
            <div class="root-selector">
                <button id="rootLocalBtn" class="root-btn active">📁 本地目录</button>
                <button id="rootServerBtn" class="root-btn">💾 服务器目录 (D:)</button>
            </div>
        </div>
        <div class="tree-wrapper" id="treeWrapper">
            <div id="treeContainer" class="tree"></div>
        </div>
    </aside>

    <main class="files-content">
        <div id="pathBar" class="path-bar">
            <span class="path-label">当前路径：</span>
            <span id="currentPath" class="path-value">/</span>
        </div>
        <div id="fileListPanel" class="file-list-panel">
            <div class="toolbar">
                <button id="newFolderBtn" class="btn-icon">📁 新建目录</button>
                <button id="newFileBtn" class="btn-icon">📄 新建文件</button>
                <button id="uploadBtn" class="btn-icon">📤 上传文件</button>
                <button id="refreshBtn" class="btn-icon">🔄 刷新</button>
            </div>
            <table id="fileTable">
                <thead>
                <tr><th>名称</th><th>类型</th><th>大小</th><th>修改时间</th><th>操作</th></tr>
                </thead>
                <tbody id="fileTableBody"></tbody>
            </table>
        </div>
        <div id="editorPanel" class="editor-panel" style="display: none;">
            <div class="editor-header">
                <span id="editFileName"></span>
                <button id="closeEditorBtn" class="btn-icon">✖ 关闭</button>
            </div>
            <textarea id="fileEditor" rows="20"></textarea>
            <div class="editor-actions">
                <button id="saveFileBtn" class="btn-primary">💾 保存</button>
            </div>
        </div>
    </main>
</div>
<script src="files.js"></script>
</body>
</html>
