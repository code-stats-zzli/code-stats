<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeStats Platform</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
<!-- 顶部导航栏（页签加大） -->
<header class="topbar">
    <div class="topbar-brand">
        <span class="brand-icon">◈</span>
        <span class="brand-text">CodeStats</span>
    </div>
    <nav class="topbar-tabs" id="topbarTabs">
        <button class="topbar-tab active" data-tab="intro">
            <span class="tab-icon">🏠</span> 项目介绍
        </button>
        <button class="topbar-tab" data-tab="database">
            <span class="tab-icon">🗄️</span> 数据库
        </button>
        <button class="topbar-tab" data-tab="files">
            <span class="tab-icon">📁</span> 目录管理
        </button>
        <button class="topbar-tab" data-tab="codestats">
            <span class="tab-icon">📊</span> 代码分析
        </button>
        <button class="topbar-tab" data-tab="agent">
            <span class="tab-icon">🤖</span> Agent
        </button>
    </nav>
    <div class="topbar-status" id="topbarStatus">
        <span class="status-dot"></span>
        <span class="status-text">就绪</span>
    </div>
</header>

<!-- 主内容区 -->
<main class="main-content" id="mainContent">
    <!-- 项目介绍面板：改为 iframe 加载独立介绍页面 -->
    <div class="tab-panel active" id="panel-intro">
        <iframe src="docs/project.html" class="panel-iframe" title="项目介绍" style="width:100%; height:100%; border:none;"></iframe>
    </div>

    <!-- 数据库面板（iframe嵌入） -->
    <div class="tab-panel" id="panel-database">
        <iframe
                id="iframeDatabase"
                src="db/dbclient.html"
                title="数据库浏览器"
                class="panel-iframe"
                allow="fullscreen"
        ></iframe>
    </div>

    <!-- 目录管理面板（占位） -->
    <div class="tab-panel" id="panel-files">
        <div class="placeholder-panel">
            <div class="placeholder-icon">📁</div>
            <h2>目录管理</h2>
            <p class="placeholder-desc">文件浏览、编辑与项目管理功能即将上线。</p>
            <div class="placeholder-api">
                <span class="api-badge">预留接口</span>
                <code>GET /demo/files/api/list?path=</code>
                <code>GET /demo/files/api/read?path=</code>
                <code>POST /demo/files/api/upload</code>
            </div>
        </div>
    </div>

    <!-- 代码分析面板（iframe嵌入） -->
    <div class="tab-panel" id="panel-codestats">
        <iframe
                id="iframeCodeStats"
                src="code/codeStats.html"
                title="代码分析"
                class="panel-iframe"
                allow="fullscreen"
        ></iframe>
    </div>

    <!-- Agent面板（占位） -->
    <div class="tab-panel" id="panel-agent">
        <div class="placeholder-panel">
            <div class="placeholder-icon">🤖</div>
            <h2>智能 Agent</h2>
            <p class="placeholder-desc">AI 驱动的代码助手，支持自然语言查询、代码生成与智能分析。</p>
            <div class="placeholder-api">
                <span class="api-badge">预留接口</span>
                <code>POST /demo/agent/api/chat</code>
                <code>GET /demo/agent/api/sessions</code>
                <code>WS /demo/agent/ws</code>
            </div>
        </div>
    </div>
</main>

<!-- Toast 提示容器 -->
<div class="toast-container" id="toastContainer"></div>

<script src="index.js"></script>
</body>
</html>
