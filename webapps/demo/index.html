<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeStats Platform</title>
    <link rel="stylesheet" href="global-tech.css">
    <link rel="stylesheet" href="project-assistant.css">
    <link rel="stylesheet" href="index.css">
    <script src="global.js"></script>
    <script src="project-assistant.js" defer></script>
    <style>
        /* 使导航栏支持滚动 */
        .topbar-tabs {
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            flex-wrap: nowrap;
            gap: 8px;
            padding: 4px 0;
            scrollbar-width: thin;
        }
        .topbar-tabs::-webkit-scrollbar {
            height: 4px;
        }
        .topbar-tabs::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 4px;
        }
        .topbar-tab {
            flex: 0 0 auto;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<header class="topbar">
    <div class="topbar-brand">
        <span class="brand-icon">🔷</span>
        <span class="brand-text">CodeStats</span>
    </div>
    <nav class="topbar-tabs" id="topbarTabs">
        <button class="topbar-tab active" data-tab="intro">
            <span class="tab-icon">🚀</span> 项目介绍
        </button>
        <button class="topbar-tab" data-tab="database">
            <span class="tab-icon">⚡</span> 数据库
        </button>
        <button class="topbar-tab" data-tab="files">
            <span class="tab-icon">📂</span> 目录管理
        </button>
        <button class="topbar-tab" data-tab="codestats">
            <span class="tab-icon">📈</span> 代码分析
        </button>
        <button class="topbar-tab" data-tab="agent">
            <span class="tab-icon">🧠</span> Agent
        </button>
        <button class="topbar-tab" data-tab="opensource">
            <span class="tab-icon">🧰</span> 开源工具
        </button>
        <button class="topbar-tab" data-tab="apiexplorer">
            <span class="tab-icon">🔌</span> API 调试
        </button>
        <button class="topbar-tab" data-tab="3d">
            <span class="tab-icon">🌐</span> 3D 依赖图
        </button>
        <!-- 新增脚本引擎 -->
        <button class="topbar-tab" data-tab="scriptengine">
            <span class="tab-icon">⚙️</span> 脚本引擎
        </button>
    </nav>
    <div class="topbar-status" id="topbarStatus">
        <span class="status-dot"></span>
        <span class="status-text">就绪</span>
    </div>
</header>

<main class="main-content" id="mainContent">
    <div class="tab-panel active" id="panel-intro">
        <iframe src="docs/project.html" class="panel-iframe" title="项目介绍"></iframe>
    </div>
    <div class="tab-panel" id="panel-database">
        <iframe id="iframeDatabase" src="db/dbclient.html" title="数据库浏览器" class="panel-iframe"></iframe>
    </div>
    <div class="tab-panel" id="panel-files">
        <iframe id="iframeFiles" src="files/files.html" title="目录管理" class="panel-iframe"></iframe>
    </div>
    <div class="tab-panel" id="panel-codestats">
        <iframe id="iframeCodeStats" src="code/codeStats.html" title="代码分析" class="panel-iframe"></iframe>
    </div>
    <div class="tab-panel" id="panel-agent">
        <iframe id="iframeAgent" src="agent/agent.html" title="AI Agent" class="panel-iframe"></iframe>
    </div>
    <div class="tab-panel" id="panel-opensource">
        <iframe id="iframeOpensource" src="opensource/opensource.html" title="开源工具" class="panel-iframe"></iframe>
    </div>
    <div class="tab-panel" id="panel-apiexplorer">
        <iframe src="apiexplorer/index.html" class="panel-iframe" title="API调试"></iframe>
    </div>
    <div class="tab-panel" id="panel-3d">
        <iframe src="three/scene/3d-scene.html" class="panel-iframe" title="3D场景"></iframe>
    </div>
    <!-- 新增脚本引擎面板 -->
    <div class="tab-panel" id="panel-scriptengine">
        <iframe src="scriptengine/scriptengine.html" class="panel-iframe" title="脚本引擎"></iframe>
    </div>
</main>

<div class="toast-container" id="toastContainer"></div>
<script src="index.js"></script>
</body>
</html>
