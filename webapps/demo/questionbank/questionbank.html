<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>题库分析</title>
    <link rel="stylesheet" href="../global-tech.css">
    <link rel="stylesheet" href="questionbank.css">
    <script src="../global.js"></script>
    <style>
        .tab-container { margin-top: 20px; }
        .tab-bar { display: flex; gap: 8px; border-bottom: 1px solid rgba(0,102,255,0.2); }
        .tab-btn { padding: 8px 20px; background: none; border: none; cursor: pointer; border-radius: 20px 20px 0 0; }
        .tab-btn.active { background: var(--accent-primary); color: white; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        .search-row { display: flex; gap: 12px; margin-bottom: 16px; }
        .search-row input { flex: 1; }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 8px 12px; border-bottom: 1px solid #e2e8f0; text-align: left; }
        .data-table th { background: rgba(0,102,255,0.1); }
        .file-list { max-height: 200px; overflow-y: auto; background: rgba(0,0,0,0.03); border-radius: 16px; padding: 12px; list-style: none; }
        .file-list li { font-family: monospace; font-size: 12px; padding: 4px 0; border-bottom: 1px dashed rgba(0,102,255,0.2); }
    </style>
</head>
<body>
<div class="qb-container">
    <div class="qb-config card">
        <h2>📚 题库分析配置</h2>
        <div class="config-row">
            <label>📁 根目录：</label>
            <input type="text" id="rootDir" placeholder="例如: D:/题库">
            <button id="browseBtn" class="btn-secondary">浏览</button>
        </div>
        <div class="config-row">
            <label>🔍 文件名模糊匹配：</label>
            <input type="text" id="keyword" placeholder="例如: 真题">
        </div>
        <div class="config-row">
            <label>📌 文件名前缀匹配（逗号分隔）：</label>
            <input type="text" id="namePrefixes" placeholder="例如: 真题,模拟卷,测试">
            <span class="hint">多个前缀以英文逗号分隔，匹配文件名开头（优先级高于模糊匹配）</span>
        </div>
        <div class="config-row">
            <label>📄 合并输出文件：</label>
            <input type="text" id="outputFile" placeholder="例如: D:/merged/题库合并.txt">
            <button id="selectOutputBtn" class="btn-secondary">选择文件</button>
        </div>
        <div class="action-bar">
            <button id="mergeBtn" class="btn-primary">🚀 开始合并</button>
            <button id="resetBtn" class="btn-secondary">重置</button>
        </div>
        <div id="mergeProgress" class="progress-area" style="display: none;">
            <div class="progress-bar"><div class="progress-fill"></div></div>
            <div class="progress-text"></div>
        </div>
    </div>

    <!-- 合并结果卡片（初始隐藏） -->
    <div id="mergeResultCard" class="qb-result card" style="display: none;">
        <div class="result-header">
            <h3>✅ 合并结果</h3>
            <button id="downloadMergedBtn" class="btn-secondary">⬇️ 下载合并文件</button>
        </div>
        <div id="mergeSummary"></div>
        <h4>📑 匹配的文件列表：</h4>
        <ul id="fileList" class="file-list"></ul>
    </div>

    <!-- Tab 容器 -->
    <div class="tab-container" style="margin-top: 20px;">
        <div class="tab-bar">
            <button class="tab-btn active" data-tab="result">📋 合并结果</button>
            <button class="tab-btn" data-tab="preview">📊 数据预览</button>
        </div>
        <div class="tab-content">
            <div class="tab-pane active" id="tabResultPane">
                <!-- 这里显示合并结果内容，实际通过 js 移动或复制 -->
                <div id="resultPanePlaceholder">请先执行合并操作</div>
            </div>
            <div class="tab-pane" id="tabPreviewPane" style="display: none;">
                <div class="qb-preview card">
                    <div class="result-header">
                        <h3>📊 数据预览（支持模糊搜索）</h3>
                        <div class="search-row">
                            <input type="text" id="tableSearchInput" placeholder="输入关键词模糊匹配任意列...">
                            <button id="searchTableBtn" class="btn-primary">🔍 筛选</button>
                            <button id="resetTableBtn" class="btn-secondary">重置</button>
                        </div>
                    </div>
                    <div id="dataTableWrapper" style="overflow-x: auto; max-height: 400px; overflow-y: auto;">
                        <table class="data-table" id="previewTable">
                            <thead id="previewTableHead"></thead>
                            <tbody id="previewTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="qb-search card">
        <h3>🔎 按题目查找答案</h3>
        <div class="search-row">
            <input type="text" id="searchKeyword" placeholder="输入题目关键词...">
            <button id="searchBtn" class="btn-primary">搜索</button>
        </div>
        <div id="searchResult" class="search-result"></div>
    </div>
</div>
<script src="questionbank.js"></script>
</body>
</html>
