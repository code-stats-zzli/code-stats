<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>参数配置</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { height:100%; background:transparent; font-family:'Inter','Segoe UI',sans-serif; }
        .config-wrapper { padding:16px 20px; overflow-y:auto; height:100%; display:flex; flex-direction:column; gap:14px; }
        .config-group { display:flex; flex-direction:column; gap:4px; }
        .config-group label { font-weight:500; font-size:13px; color:#0066ff; }
        .config-group select, .config-group input[type="text"], .config-group textarea { width:100%; padding:8px 12px; border:1px solid rgba(0,102,255,0.3); border-radius:12px; background:white; color:#1e293b; font-size:13px; font-family:'JetBrains Mono',monospace; transition:border-color 0.2s; }
        .config-group select:focus, .config-group input:focus, .config-group textarea:focus { outline:none; border-color:#0066ff; box-shadow:0 0 0 3px rgba(0,102,255,0.15); }
        .config-group textarea { resize:vertical; min-height:70px; }
        .java-options { display:none; flex-direction:column; gap:6px; }
        .inline-actions { display:flex; gap:8px; margin-top:4px; flex-wrap:wrap; }
        .btn-sm { padding:4px 12px; font-size:12px; border-radius:20px; border:1px solid rgba(0,102,255,0.3); background:rgba(0,102,255,0.08); cursor:pointer; transition:0.2s; color:#0066ff; }
        .btn-sm:hover { background:rgba(0,102,255,0.2); }
        .action-group { display:flex; gap:8px; flex-wrap:wrap; }
        .action-group .btn-sm { flex:1; text-align:center; }
        .file-upload-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
        .file-upload-row input[type="file"] { flex:1; padding:6px 0; }
        ::-webkit-scrollbar { width:4px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:#0066ff; border-radius:4px; }
    </style>
</head>
<body>
<div class="config-wrapper" id="configWrapper">
    <div class="config-group">
        <label for="languageSelect">语言</label>
        <select id="languageSelect">
            <option value="python">Python</option>
            <option value="java">Java</option>
            <option value="c">C</option>
            <option value="cpp">C++</option>
            <option value="rest">REST</option>
        </select>
    </div>
    <div class="config-group">
        <label for="executionMode">执行模式</label>
        <select id="executionMode">
            <option value="source">源码（需编译）</option>
            <option value="binary">二进制 / Class</option>
            <option value="jar">JAR</option>
            <option value="directory">目录</option>
        </select>
    </div>
    <div class="config-group java-options" id="javaOptions">
        <label>类名</label>
        <input type="text" id="className" placeholder="com.example.Main">
        <label>方法名</label>
        <input type="text" id="methodName" placeholder="main">
    </div>
    <div class="config-group">
        <label for="paramsInput">参数 (JSON)</label>
        <textarea id="paramsInput" rows="3" spellcheck="false"></textarea>
        <div class="inline-actions">
            <button id="formatJsonBtn" class="btn-sm">🎨 格式化</button>
        </div>
    </div>
    <div class="config-group">
        <label>上传脚本文件</label>
        <div class="file-upload-row">
            <input type="file" id="fileInput" accept=".py,.java,.c,.cpp,.jar,.txt">
            <button id="uploadBtn" class="btn-sm">📤 上传并执行</button>
        </div>
    </div>
    <div class="config-group action-group">
        <button id="exampleBtn" class="btn-sm">📋 示例</button>
        <button id="clearBtn" class="btn-sm">🗑️ 清空</button>
    </div>
</div>
<script src="scriptengine-config.js"></script>
</body>
</html>
