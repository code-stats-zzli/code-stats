<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统检查 - CodeStats</title>
    <link rel="stylesheet" href="../global-tech.css">
    <link rel="stylesheet" href="systemcheck.css">
    <script src="../global.js"></script>
</head>
<body>
<div class="systemcheck-container">
    <!-- 左侧配置面板 -->
    <aside class="sys-config-panel">
        <div class="sys-config-header">🛡️ 系统检查配置</div>
        <div class="sys-config-body">
            <div class="sys-config-section">
                <div class="sys-config-section-title">检查项</div>
                <div id="checkList"></div>
            </div>
            <div class="sys-config-section">
                <div class="sys-config-section-title">执行参数</div>
                <div class="sys-thread-row">
                    <label>并发线程数</label>
                    <input type="number" id="threadCount" min="1" max="16" value="4">
                </div>
            </div>
        </div>
        <div class="sys-config-footer">
            <button id="runBtn" class="btn-primary">🚀 开始检查</button>
            <button id="resetBtn" class="btn-secondary">重置配置</button>
        </div>
    </aside>

    <!-- 右侧结果面板 -->
    <main class="sys-result-panel">
        <div class="sys-result-header">
            <div class="sys-summary-stats" id="summaryStats">
                <div class="item ok"><span>合规</span><span class="num">0</span></div>
                <div class="item bad"><span>不合规</span><span class="num">0</span></div>
                <div class="item warn"><span>警告</span><span class="num">0</span></div>
                <div class="item info"><span>信息</span><span class="num">0</span></div>
            </div>
            <div class="sys-export-btns">
                <button id="exportHtmlBtn" class="btn-secondary" disabled>📄 HTML</button>
                <button id="exportCsvBtn" class="btn-secondary" disabled>📊 CSV</button>
                <button id="exportJsonBtn" class="btn-secondary" disabled>📋 JSON</button>
            </div>
        </div>
        <div class="sys-result-body" id="resultBody">
            <div class="sys-empty">点击「开始检查」执行系统安全检查</div>
        </div>
    </main>
</div>
<script src="systemcheck.js"></script>
</body>
</html>
