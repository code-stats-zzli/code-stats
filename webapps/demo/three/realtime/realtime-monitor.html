<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D 实时监控 · 系统时空穿梭机</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            overflow: hidden;
            background: #0a0f1a;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            color: #e2e8f0;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: rgba(20, 30, 50, 0.85);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(0, 102, 255, 0.3);
            flex-shrink: 0;
            z-index: 10;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #4da6ff;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .btn {
            background: rgba(0, 102, 255, 0.2);
            border: 1px solid rgba(0, 102, 255, 0.4);
            color: #e2e8f0;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn:hover {
            background: rgba(0, 102, 255, 0.4);
        }
        .status {
            font-size: 14px;
            color: #94a3b8;
            min-width: 80px;
            text-align: right;
        }

        .main-layout {
            display: flex;
            flex: 1;
            height: calc(100vh - 64px);
            min-height: 0;
        }

        #canvas-container {
            flex: 7;
            position: relative;
            overflow: hidden;
            background: #0a0f1a;
        }

        #right-panel {
            flex: 3;
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(0, 102, 255, 0.3);
            background: #0a0f1a;
            min-width: 0;
            height: 100%;
        }

        #thread-list-panel {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(0, 102, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            min-height: 0;
        }

        #thread-flow-panel {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #0a0f1a;
            min-height: 0;
        }

        .panel-title {
            font-weight: 600;
            color: #4da6ff;
            font-size: 15px;
            margin-bottom: 8px;
            display: block;
        }

        .thread-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .thread-table th {
            background: rgba(0, 102, 255, 0.2);
            padding: 6px 8px;
            text-align: left;
            font-weight: 600;
            color: #4da6ff;
            position: sticky;
            top: 0;
            z-index: 2;
            backdrop-filter: blur(4px);
        }
        .thread-table td {
            padding: 4px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            vertical-align: middle;
        }
        .status-badge {
            display: inline-block;
            padding: 0 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }
        .status-running { background: #22c55e; color: #0a0f1a; }
        .status-blocked { background: #ef4444; color: white; }
        .status-waiting { background: #f59e0b; color: #0a0f1a; }
        .status-completed { background: #3b82f6; color: white; }
        .status-idle { background: #94a3b8; color: #0a0f1a; }

        .chain-cell {
            max-width: 160px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 11px;
            color: #94a3b8;
        }

        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 15, 26, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            transition: opacity 0.5s;
        }
        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #4da6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .legend {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 12px 18px;
            border-radius: 16px;
            border: 1px solid rgba(0, 102, 255, 0.3);
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            z-index: 5;
            font-size: 13px;
            pointer-events: none;
        }
        .legend-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .color-dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
        }
        .color-dot.thread-running { background: #22c55e; }
        .color-dot.thread-waiting { background: #f59e0b; }
        .color-dot.thread-blocked { background: #ef4444; }
        .color-dot.memory-heap   { background: #4da6ff; }
        .color-dot.memory-nonheap{ background: #a78bfa; }
        .color-dot.pool-active   { background: #22c55e; }
        .color-dot.pool-idle     { background: #94a3b8; }

        .hint {
            position: absolute;
            bottom: 30px;
            right: 30px;
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            background: rgba(0,0,0,0.4);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            pointer-events: none;
            z-index: 5;
        }

        #canvas-container canvas,
        #thread-flow-panel canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        #thread-flow-panel .legend-inner {
            position: absolute;
            bottom: 16px;
            left: 16px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            padding: 6px 12px;
            border-radius: 12px;
            border: 1px solid rgba(0,102,255,0.2);
            display: flex;
            gap: 16px;
            font-size: 11px;
            z-index: 5;
            pointer-events: none;
        }
        #thread-flow-panel .legend-inner .item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .dot.running { background: #22c55e; }
        .dot.blocked { background: #ef4444; }

        #thread-list-panel::-webkit-scrollbar {
            width: 4px;
        }
        #thread-list-panel::-webkit-scrollbar-track {
            background: transparent;
        }
        #thread-list-panel::-webkit-scrollbar-thumb {
            background: #4da6ff;
            border-radius: 4px;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
<div id="app">
    <header class="header">
        <h1>🚀 3D 实时监控 · 系统时空穿梭机</h1>
        <div class="controls">
            <button id="toggleAutoRotate" class="btn">⏸️ 暂停旋转</button>
            <span id="status" class="status">🟢 运行中</span>
        </div>
    </header>

    <div class="main-layout">
        <div id="canvas-container">
            <div id="loading-overlay">
                <div class="spinner"></div>
                <div id="loading-text">正在初始化 3D 场景...</div>
            </div>
            <div class="legend">
                <div class="legend-group">
                    <div class="legend-item"><span class="color-dot thread-running"></span> 运行</div>
                    <div class="legend-item"><span class="color-dot thread-waiting"></span> 等待</div>
                    <div class="legend-item"><span class="color-dot thread-blocked"></span> 阻塞</div>
                </div>
                <div class="legend-group">
                    <div class="legend-item"><span class="color-dot memory-heap"></span> 堆内存</div>
                    <div class="legend-item"><span class="color-dot memory-nonheap"></span> 非堆</div>
                </div>
                <div class="legend-group">
                    <div class="legend-item"><span class="color-dot pool-active"></span> 活跃连接</div>
                    <div class="legend-item"><span class="color-dot pool-idle"></span> 空闲连接</div>
                </div>
            </div>
            <div class="hint">🖱 拖拽旋转 · 滚轮缩放 · 实时数据每 1s 刷新</div>
        </div>

        <div id="right-panel">
            <div id="thread-list-panel">
                <span class="panel-title">🧵 实时线程列表</span>
                <div id="thread-list-container" style="overflow-x: auto;">
                    <table class="thread-table" id="threadTable">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>名称</th>
                            <th>状态</th>
                            <th>调用链</th>
                        </tr>
                        </thead>
                        <tbody id="threadTableBody"></tbody>
                    </table>
                </div>
            </div>
            <div id="thread-flow-panel">
                <span class="panel-title" style="position:absolute; top:12px; left:16px; z-index:10; pointer-events:none;">🌀 粒子流</span>
                <div class="legend-inner">
                    <span class="item"><span class="dot running"></span> 运行中</span>
                    <span class="item"><span class="dot blocked"></span> 阻塞</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module" src="realtime-monitor.js"></script>
</body>
</html>
