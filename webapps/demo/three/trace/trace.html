<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D 动态调用链 · 流光粒子</title>
    <link rel="stylesheet" href="trace.css" />
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
<div id="app">
    <header class="header">
        <h1>⚡ 实时调用链 · 流光粒子</h1>
        <div class="controls">
            <button id="sendBtn" class="btn-primary">🚀 发送测试请求</button>
            <span id="status" class="status">就绪</span>
        </div>
    </header>
    <div id="canvas-container">
        <div id="loading-overlay">
            <div class="spinner"></div>
            <div id="loading-text">正在加载调用链数据...</div>
            <div id="error-msg" class="error-msg" style="display:none;"></div>
        </div>
    </div>
    <div class="legend">
        <div class="legend-item"><span class="color-dot controller"></span> Controller</div>
        <div class="legend-item"><span class="color-dot service"></span> Service</div>
        <div class="legend-item"><span class="color-dot mapper"></span> Mapper</div>
        <div class="legend-item"><span class="color-dot particle"></span> 粒子流</div>
    </div>
    <div class="hint">🖱 拖拽旋转 · 滚轮缩放 · 点击按钮触发流光</div>
</div>
<script type="module" src="trace.js"></script>
</body>
</html>
